/* Moving a task changes only the day she plans to do it. A hard deadline is never moved;
   a new day is kept before it. */
function moveDate(t, v){
  let nd = v === 'tomorrow' ? addDays(S.today, 1) : v === 'free' ? nextFreeDay(t) : v === 'nextweek' ? addDays(mondayOf(S.today), 7) : null;
  if (nd && t.echeance && nd > t.echeance) nd = t.echeance > S.today ? t.echeance : nd;
  return nd;
}
function laterGo(id, v){
  const t = S.tasks.get(id); if (!t) return;
  const patch = { modifieLe:nowIso() };
  if (v === 'pause') patch.statut = 'pause';
  else {
    patch.prevue = moveDate(t, v);
    patch.reports = (t.reports || 0) + 1;
    if (t.suggere && t.suggere.prevue){ const sg = Object.assign({}, t.suggere); delete sg.prevue; patch.suggere = sg; }
  }
  S.laterOpen = null;
  const msg = v === 'pause' ? 'Paused. It’s in Plans › Paused.' : v === 'nodate' ? 'Kept for another day, in ' + rubLabel(t.rubrique) : 'Moved to ' + fmtRel(patch.prevue);
  write('t:' + id, () => tasksCol().doc(id).update(patch), msg);
}
function setDay(k, v){
  const cur = dayState();
  const doc = Object.assign({ date:S.today }, cur, { [k]: cur[k] === v ? null : v, modifieLe:nowIso() });
  S.day = doc; render();
  write('day', () => S.db.doc('jours/' + S.today).set(doc));
}

function normFreq(f){
  if (!f || typeof f !== 'object') return { type:'quotidien' };
  const t = { daily:'quotidien', days:'jours', weekly:'hebdo', interval:'intervalle' }[f.type] || f.type;
  if (t === 'jours'){ const j = Array.from(new Set((f.jours || f.days || []).map(Number).filter(n => n >= 1 && n <= 7))).sort(); return j.length ? { type:'jours', jours:j } : { type:'quotidien' }; }
  if (t === 'intervalle'){ const n = Math.max(2, Math.min(90, Math.round(Number(f.intervalle || f.every) || 2))); return { type:'intervalle', intervalle:n }; }
  if (t === 'hebdo') return { type:'hebdo' };
  return { type:'quotidien' };
}

/* Import: adds documents that are not already here (same id); never overwrites or deletes. */
const IMPORT_COLS = ['taches','routines','occurrences','idees','projets','frictions','astuces'];
function sheetImport(s){
  const c = s.counts;
  let h = head('Import a copy');
  h += `<div class="sheet-body"><p style="margin:0">This file contains:</p><ul class="help">${IMPORT_COLS.filter(k => c[k]).map(k => `<li>${c[k]} ${({ taches:'tasks and items', routines:'routines', occurrences:'ticked routine days', idees:'things to keep in mind', projets:'projects', frictions:'problems in Make life easier', astuces:'answers to tips' })[k]}</li>`).join('')}${s.data.reglages ? '<li>settings (only used if you have none yet)</li>' : ''}</ul>
    <p class="small">Items already in your space are left as they are. Nothing is deleted.</p>
    ${s.progress ? `<p><span class="spin"></span>${esc(s.progress)}</p>` : ''}</div>
    <div class="sheet-foot"><button class="btn ghost" data-act="close-sheet">Cancel</button><button class="btn primary" data-act="import-go"${s.progress ? ' disabled' : ''}>Import</button></div>`;
  return h;
}
function readImport(file){
  const fr = new FileReader();
  fr.onload = () => {
    let data = null;
    try { data = JSON.parse(String(fr.result || '')); } catch(e){}
    if (!data || typeof data !== 'object'){ toast('This file isn’t a copy of My space.'); return; }
    const counts = {};
    IMPORT_COLS.forEach(k => { counts[k] = Array.isArray(data[k]) ? data[k].filter(x => x && typeof x === 'object').length : 0; });
    if (!IMPORT_COLS.some(k => counts[k])){ toast('Nothing to import in this file.'); return; }
    openSheet({ kind:'importer', data, counts });
  };
  fr.readAsText(file);
}
async function runImport(){
  const s = S.sheet, data = s.data;
  const have = { taches:S.tasks, routines:S.routines, occurrences:S.occ, idees:S.idees, projets:S.projets, frictions:S.frictions, astuces:S.astuces };
  let n = 0, total = 0;
  IMPORT_COLS.forEach(k => { total += s.counts[k]; });
  for (const k of IMPORT_COLS){
    for (const raw of (Array.isArray(data[k]) ? data[k] : [])){
      if (!raw || typeof raw !== 'object') continue;
      const id = String(raw.id || '');
      const body = Object.assign({}, raw); delete body.id;
      n++;
      if (n % 10 === 0){ s.progress = `Importing ${n} of ${total}…`; renderSheet(); }
      if (id && have[k].has(id)) continue;
      if (id && !/^[A-Za-z0-9_\-.~:@+]{1,200}$/.test(id)) continue;
      const ref = id ? col(k).doc(id) : col(k).doc();
      const ok = await write('imp:' + k + ':' + ref.id, () => ref.set(body));
      if (!ok){ s.progress = ''; renderSheet(); toast('Import stopped part-way. You can run it again: nothing will be doubled.'); return; }
    }
  }
  if (data.reglages && typeof data.reglages === 'object' && !S.settings){ await write('settings', () => S.db.doc('reglages/principal').set(data.reglages)); }
  closeSheet(); toast('Import finished');
}

/* Lighten today: keep firm things, offer to move flexible ones to calmer days. Nothing moves without a tick. */
function openLighten(all){
  const M = todayModel();
  const firm = M.cands.filter(isFirm).concat(M.rdvToday.filter(t => t.statut !== 'fait'));
  const flex = M.cands.filter(t => !isFirm(t)).sort((a, b) => score(a) - score(b));
  let budget = M.openLoad - (M.avail || Math.max(120, M.openLoad / 2));
  const rows = flex.map(t => {
    let on = !!all;
    if (!all && budget > 0){ on = true; budget -= durOf(t); }
    return { id:t.id, on, to:'free' };
  });
  openSheet({ kind:'lighten', firm:firm.map(t => t.id), rows });
}
function sheetLighten(s){

  h += `<div class="sheet-body">`;

async function applyLighten(){

}

  const quiet = protectedAreas().map(k => `${rubLabel(k)}: last progress ${lastDoneIn(k) || 'none recorded'}`).join('; ');
  const prefs = ((S.settings && S.settings.prefsIA) || []).join('\n');
  let scopeLine = '';
  if (scope && scope.rub && scope.mode !== 'ranger') scopeLine = `She is writing from the area "${rubLabel(scope.rub)}" (${scope.rub}): use it by default unless another area is obvious.\n`;
  let mission = `SAMAH'S TEXT\n"""\n${text}\n"""`;
  if (scope && scope.mode === 'ranger') mission = `REQUEST\nSort every open task of the area "inbox" into the right area: for each, an item {"kind":"update","id":...,"area":...} (add "kind_of_task" only if it is clearly a purchase or an appointment). Create nothing. Leave a task alone if you really can't tell.`;
  if (S.followup && text) mission = `EARLIER EXCHANGE\nShe had written:\n"""\n${S.followup.texte}\n"""\nYou asked:\n${S.followup.questions.map(x => '- ' + x).join('\n')}\n\nHER ANSWER AND ANYTHING SHE ADDS\n"""\n${text}\n"""\nHandle everything together (earlier text + answer).`;
  return `You help Samah organise daily life. She is a mother (her child is Joud), a student at UNIL, and handles paperwork, part of the household and her own goals. She writes or dictates quickly, mixed up, sometimes with dictation errors. Turn her text into suggested changes to her organiser. She confirms each one: you suggest, you never decide.

The organiser's purpose: help her carry less in her head and keep her own studies and goals alive, not maximise the number of tasks. Don't let everything about Joud automatically outrank everything else, and don't treat studies or personal time as things that can always wait.

WHAT SAMAH SAYS ABOUT HERSELF
${(S.settings && S.settings.contexte) ? S.settings.contexte : '(nothing yet)'}
${prefs ? '\nCHOICES SHE HAS MADE\n' + prefs + '\n' : ''}
TODAY: ${fmtLong(td)} ${parseISO(td).getFullYear()} (${td})${ds.temps ? ' · time available today: ' + ds.temps : ''}${ds.energie ? ' · energy: ' + ds.energie : ''}
CALENDAR
${calendarLines()}

AREAS (key: name, contents)
${rubs}
Protected areas (long-term important): ${quiet}

OPEN TASKS (id | title | area | type | planned | deadline | time | status | level)
${open || '(none)'}

ROUTINES (id | title | area | rhythm | today)
${rts || '(none)'}

DONE IN THE LAST 7 DAYS (date | title | area)
${done || '(nothing)'}

KEEP IN MIND (id | text)
${keep || '(none)'}

RECURRING PROBLEMS (id | problem | mentions)
${fr || '(none)'}

PROJECTS (id | title | area)
${pj || '(none)'}

${scopeLine}${mission}

RULES
1. One item per distinct thing. "Buy milk and nappies" is two purchases. If an open task already matches, don't create it again: use "update" only if the text changes something (a date, a detail), otherwise nothing.
2. Things already done ("I sent…", "already did…", "done"): if one open task or one routine due today clearly matches, use "complete" (task) or "complete_routine" (routine) with its id. If several could match, ask a question instead of choosing. If nothing matches, create the task with "already_done": true so it is recorded as done.
3. Purchases: kind "purchase". The area is who or what it is for (nappies → joud, stationery → etudes, detergent → maison). "quantity" only if said. Never "must" unless she says she needs it today.
4. Dates. "deadline" = a real hard deadline (exam, administrative or university due date, payment, "before/by/due"), only if said or clearly implied ("before Thursday" = the next Thursday in the calendar). "planned_date" = the day she says she will do it ("on Thursday", "tonight" = today, "tomorrow"). A day she plans to do something is NOT a deadline. You may suggest a planned_date she did not say only shortly before a near deadline; then put "planned_date" in "suggested". If a day is ambiguous, ask. Never invent a time or a deadline.
5. Appointments: kind "appointment" only when an appointment or consultation is mentioned; "time" only if said.
6. Level: "must" = a real consequence if not done soon (deadline, appointment, Joud's essential needs such as health, medicine, food, childcare arrangements, administrative deadlines). "worth" = matters but flexible. "later" = can wait. Do not mark something "must" just because it concerns Joud, or because it was mentioned last. Studies and Me matter in the long term even without urgency: don't push them to "later" by default.
7. "importance": 1 normal, 2 important, 3 very important; most things are 1 or 2.
8. "duration": rough minutes (5, 15, 30, 60 or 120) for tasks; put "duration" in "suggested".
9. Thoughts that are not yet actions — ideas, decisions to make, questions, worries, vague plans ("I need to think about…", "maybe we should…", "I should rethink…") → kind "keep", NOT a task. Only create a task when there is a clear action she intends to do.
10. A recurring practical difficulty with her surroundings (losing keys again, can't find documents, forgetting things when leaving, clutter in one spot) → kind "friction" with a short "problem". If one of the recurring problems above matches, give its "id". Don't propose solutions here.
11. Routines ("every day", "every Monday", "every other day") → kind "routine" with "frequency". Don't recreate an existing routine.
12. Rescheduling ("tomorrow is too full", "no time today"): kind "update" with a new "planned_date" for flexible tasks, towards the least busy days. Never move an appointment or a deadline. Give a short "reason" for each move.
13. Projects: kind "project" only if she explicitly describes a goal with several steps.
14. Titles: short, start with a verb, in clear English (translate if she wrote in another language; keep names as they are). Fix obvious dictation errors; if a word is unclear, ask rather than guess.
15. "next_step" only for a vague or big task ("work on my thesis"): a concrete first step of about 15 minutes; put "next_step" in "suggested".
16. "area": one of the keys above; if really unsure, "inbox"; add "area" to "suggested" when the choice isn't obvious. "sub" (room, course, shop) only if clear.
17. "reason": 12 words at most, for "must", deadlines, suggested dates and moves.
18. At most 15 items. Create nothing that isn't in her text.

FORMAT: reply with only one JSON object, no other text:
{"summary":"one short sentence","questions":[],"items":[{"kind":"task","title":"Tidy the kitchen","area":"maison","sub":null,"planned_date":null,"deadline":null,"time":null,"level":"worth","importance":1,"duration":30,"next_step":null,"already_done":false,"suggested":["duration"],"reason":""}]}
kind is one of: task, purchase, appointment, complete, complete_routine, update, routine, keep, friction, project.
- complete / complete_routine / update: add "id" (exact id from above); for update give only the fields that change ("title","area","planned_date","deadline","time","level","duration","kind_of_task").
- purchase: "title", "area", optional "quantity", "aisle": one of ${AISLES.map(x => x[0]).join(' | ')}.
- routine: "title", "area", "frequency": {"type":"daily"} | {"type":"days","days":[1,4]} (1 = Monday … 7 = Sunday) | {"type":"weekly"} | {"type":"interval","every":14}.
- keep: "text", "area" (optional).
- friction: "problem", "area" (optional), "id" if it matches an existing one.
- project: "title", "area", "horizon": "soon" | "months" | "someday".`;
}

const SG = { planned_date:'prevue', deadline:'echeance', area:'rubrique', next_step:'action', duration:'duree', level:'niveau' };
function normalize(raw){
  const out = { elements:[], questions:[], resume:'', dejaListe:[] };
  if (!raw || typeof raw !== 'object') return out;
  const keys = visibleRubs().map(r => r.key);
  const arr = Array.isArray(raw.items) ? raw.items : Array.isArray(raw.elements) ? raw.elements : [];
  const openBuys = new Set(allTasks().filter(t => t.type === 'achat' && isOpenAct(t)).map(t => norm(t.titre)));
  const seenBuys = new Set();
  for (const e of arr.slice(0, 15)){
    if (!e || typeof e !== 'object') continue;
    let kind = String(e.kind || e.action || 'task');
    const it = { inclus:true, suggere:{} };
    (Array.isArray(e.suggested) ? e.suggested : Array.isArray(e.suggere) ? e.suggere : []).forEach(x => { if (SG[x]) it.suggere[SG[x]] = true; });
    it.titre = clean(e.title || e.titre, 140);
    it.rubrique = keys.includes(e.area) ? e.area : (keys.includes(e.rubrique) ? e.rubrique : null);
    it.sous = clean(e.sub, 60) || null;
    it.prevue = isISO(e.planned_date) ? e.planned_date : null;
    it.echeance = isISO(e.deadline) ? e.deadline : null;
    it.heure = typeof e.time === 'string' && /^\d{2}:\d{2}$/.test(e.time) ? e.time : null;
    it.niveau = LEVELS.some(x => x[0] === e.level) ? e.level : null;
    it.importance = [1,2,3].includes(Number(e.importance)) ? Number(e.importance) : null;
    it.duree = [5,15,30,60,120].includes(Number(e.duration)) ? Number(e.duration) : null;
    it.action_suivante = clean(e.next_step, 160) || null;
    it.dejaFait = e.already_done === true;
    it.raison = clean(e.reason, 140);
    it.qte = clean(e.quantity, 60) || null;
    it.rayon = AISLES.some(x => x[0] === e.aisle) ? e.aisle : null;
    if (kind === 'done'){ const id = String(e.id || ''); if (S.tasks.has(id)) kind = 'complete'; else { kind = 'task'; it.dejaFait = true; } }
    if (kind === 'task' || kind === 'purchase' || kind === 'appointment'){
      it.action = 'creer';
      it.type = kind === 'purchase' ? 'achat' : kind === 'appointment' ? 'rdv' : 'tache';
      if (!it.titre) continue;
      it.rubrique = it.rubrique || (keys.includes(S.scopeRub) ? S.scopeRub : 'inbox');
      if (it.type === 'achat' && !it.dejaFait){
        const n = norm(it.titre);
        if (openBuys.has(n)){ out.dejaListe.push(it.titre); continue; }
        if (seenBuys.has(n)) continue;
        seenBuys.add(n);
      }
    } else if (kind === 'complete' || kind === 'update'){
      const id = String(e.id || ''); if (!S.tasks.has(id)) continue;
      it.action = kind === 'complete' ? 'terminer' : 'modifier'; it.id = id;
      const tk = e.kind_of_task; it.type = tk === 'purchase' ? 'achat' : tk === 'appointment' ? 'rdv' : tk === 'task' ? 'tache' : null;
      if (it.action === 'modifier' && !(it.titre || it.type || it.rubrique || it.sous || it.prevue || it.echeance || it.heure || it.niveau || it.duree || it.action_suivante)) continue;
    } else if (kind === 'complete_routine'){
      const id = String(e.id || ''); if (!S.routines.has(id)) continue;
      it.action = 'terminer_routine'; it.id = id;
    } else if (kind === 'routine'){
      if (!it.titre) continue;
      it.action = 'creer_routine'; it.frequence = normFreq(e.frequency || e.frequence);
      it.rubrique = it.rubrique && it.rubrique !== 'inbox' ? it.rubrique : 'maison';
    } else if (kind === 'keep'){
      it.action = 'garder'; it.titre = clean(e.text || e.title, 300); if (!it.titre) continue;
    } else if (kind === 'friction'){
      it.action = 'friction'; it.titre = clean(e.problem || e.title, 200); if (!it.titre) continue;
      const id = String(e.id || ''); if (S.frictions.has(id)) it.id = id;
    } else if (kind === 'project'){
      it.action = 'projet'; if (!it.titre) continue;
      it.horizon = HORIZONS.some(x => x[0] === e.horizon) ? e.horizon : 'soon';
      it.rubrique = it.rubrique && it.rubrique !== 'inbox' ? it.rubrique : 'maison';
    } else continue;
    out.elements.push(it);
  }
  out.questions = (Array.isArray(raw.questions) ? raw.questions : []).map(x => clean(x, 220)).filter(Boolean).slice(0, 4);
  out.resume = clean(raw.summary || raw.resume, 220);
  return out;
}
function fallbackReview(text, scope){
  const parts = text.split(/\n|;|•/).map(x => x.replace(/^[-*\s]+/, '').trim()).filter(Boolean).slice(0, 15);
  const rub = scope && scope.rub ? scope.rub : 'inbox';
  return { source:'as-is', texte:text, scope, resume:'', questions:[], dejaListe:[], fallback:true,

}

const AI_OFF = ['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed'];

/* Quick add: 1) the words are saved first (collection `saisies`), so nothing is ever lost;
   2) the assistant suggests; 3) she confirms in the review sheet. A suggestion she closes without
   saving stays under “Ready to check”. */
async function organize(name, opts){
  opts = opts || {};
  if (S.readOnly){ toast('This account can’t change this space.'); return; }
  if (S.busy) return;
  if (!S.db){ toast('Your data isn’t available here.'); return; }
  let scope = scopeOf(name), text = '', saisieId = opts.saisieId || null;
  if (saisieId){
    const x = S.saisies.get(saisieId); if (!x) return;
    text = String(x.texte || ''); scope = x.mode === 'ranger' ? scopeOf('ranger') : { name:'today', rub:x.scopeRub || null };
  } else if (scope.mode !== 'ranger'){
    const ta = document.getElementById('capText-' + scope.name);
    text = ta ? ta.value.trim() : '';
    if (!text){ if (ta) ta.focus(); return; }
  }
  S.scopeRub = scope.rub || null;
  const fullText = S.followup && text && !saisieId ? S.followup.texte + '\n\n[The assistant asked: ' + S.followup.questions.join(' ') + ']\nHer answer: ' + text : text;
  const prevFollow = S.followup && S.followup.saisieId;
  if (!saisieId){
    const ref = col('saisies').doc();
    const ok = await write('s:' + ref.id, () => ref.set({ texte:String(fullText).slice(0, 8000), scopeRub:scope.rub && scope.mode !== 'ranger' ? scope.rub : null, mode:scope.mode || null, creeLe:nowIso(), statut:'en_cours' }));
    if (!ok){ setStatus(scope.name, 'Couldn’t save just now. Your text is still here; try again in a moment.'); return; }
    saisieId = ref.id;
    if (scope.mode !== 'ranger') clearDraft(scope);
    if (prevFollow && prevFollow !== saisieId) write('s:' + prevFollow, () => col('saisies').doc(prevFollow).delete());
  }
  S.followup = null;
  const markWaiting = statut => write('s:' + saisieId, () => col('saisies').doc(saisieId).update({ statut }));
  if (S.sample === undefined && S.sampleP){ try { S.sample = await S.sampleP; } catch(e){ S.sample = null; } }
  if (!S.sample){ await markWaiting('a_trier'); setStatus(scope.name, 'Saved. The assistant isn’t available in this view, so your note is waiting under “Saved, not sorted yet”.'); render(); return; }
  const ctl = new AbortController();
  S.busy = { ctl, scope, saisieId };
  setStatus(scope.name, `<div><span class="spin" aria-hidden="true"></span>Saved. Sorting it… <span class="small">up to a minute</span></div><div class="acts"><button class="btn ghost small" data-act="stop-ai">Stop</button></div>`);
  render();
  try {
    const raw = await S.sample.json(buildPrompt(fullText, scope), { signal:ctl.signal, modelTier:'default' });
    const rev = normalize(raw);
    Object.assign(rev, { source:'ai', texte:fullText, scope, saisieId });
    if (!rev.elements.length && !rev.questions.length){
      await markWaiting('a_trier');
      setStatus(scope.name, scope.mode === 'ranger' ? 'Nothing to sort right now.' : (rev.dejaListe.length ? 'Already on your shopping list: ' + esc(rev.dejaListe.join(', ')) + '.' : 'I couldn’t find anything to sort in this note. It’s kept under “Saved, not sorted yet”, where you can add it as it is.'));
      if (rev.dejaListe.length || scope.mode === 'ranger') write('s:' + saisieId, () => col('saisies').doc(saisieId).delete());
      return;
    }
    write('s:' + saisieId, () => col('saisies').doc(saisieId).update({ statut:'propose', proposition:raw, propLe:nowIso() }));
    setStatus(scope.name, '');
    openSheet({ kind:'review', rev });
  } catch(e){
    const code = e && e.code;
    await markWaiting('a_trier');
    if (code === 'cancelled') setStatus(scope.name, 'Stopped. Your note is saved under “Saved, not sorted yet”.');
    else if (AI_OFF.includes(code)){ S.sample = null; setStatus(scope.name, 'Saved. The assistant isn’t allowed to answer here, so your note is waiting under “Saved, not sorted yet”. You can add it as it is.'); }
    else if (code === 'rate_limited') setStatus(scope.name, 'Saved. The assistant has reached a usage limit for now. Sort the note later, or add it as it is.');
    else if (code === 'session_expired') setStatus(scope.name, 'Saved. Your Claude session has expired: sign in again, then tap “Sort now”.');
    else if (code === 'prompt_too_large') setStatus(scope.name, 'Saved. The note is too long to sort in one go; add it as it is, or split it.');
    else setStatus(scope.name, 'Saved. The assistant didn’t answer properly this time. Tap “Sort now” on the note to try again.');
  } finally {
    S.busy = null;
    render();
  }
}

const KIND_LABEL = it => it.action === 'creer' ? (it.dejaFait ? 'Already done, to note' : it.type === 'achat' ? 'To buy' : it.type === 'rdv' ? 'Appointment' : 'New task')
  : ({ terminer:'Mark as done', terminer_routine:'Routine done today', modifier:'Change', creer_routine:'New routine · ' + freqLabel({ frequence:it.frequence }), garder:'Keep in mind', friction:'Make life easier · noted for later', projet:'New project' })[it.action] || '';
function sheetReview(s){

    const rubSel = `<select class="field sm" data-f="rv-rub" data-i="${i}" aria-label="Area" style="max-width:200px">${visibleRubs().filter(r => !['creer_routine','projet'].includes(it.action) || r.key !== 'inbox').map(r => `<option value="${esc(r.key)}"${it.rubrique === r.key ? ' selected' : ''}>${esc(r.label)}</option>`).join('')}</select>`;

    } else if (it.action === 'modifier'){
      body = `<span class="rv-title">${esc(t ? t.titre : '')}</span>${it.rubrique && t && it.rubrique !== t.rubrique ? `<span class="small">to ${rubChip(it.rubrique)}</span>` : ''}${it.titre && t && it.titre !== t.titre ? `<span class="small">new title: ${esc(it.titre)}</span>` : ''}${t && t.echeance && it.prevue ? `<span class="small">Its deadline stays ${fmtRel(t.echeance)}.</span>` : ''}`;

  return h;
}

async function applyReview(){

    if (it.action === 'creer'){
      const done = it.dejaFait;
      const doc = { titre:it.titre, rubrique:it.rubrique || 'inbox', sous:it.sous, type:it.type || 'tache', prevue:done ? null : it.prevue, echeance:it.echeance, heure:it.type === 'rdv' ? it.heure : null,
        importance:it.importance || 1, niveau:it.niveau, duree:it.type === 'achat' ? null : it.duree, urgence:null, raison:it.raison || null, action:it.action_suivante, etapes:it.action_suivante ? [{ t:it.action_suivante, fait:false }] : [],
        qte:it.type === 'achat' ? it.qte : null, rayon:it.type === 'achat' ? (it.rayon || guessAisle(it.titre)) : null, magasin:null, recurrent:false, note:null, suggere:Object.assign({}, it.suggere), source:rev.source,
        statut:done ? 'fait' : 'a_faire', creeLe:now, modifieLe:now, faitLe:done ? now : null, faitJour:done ? S.today : null, reports:0 };
      const ref = tasksCol().doc();
      res = await write('t:' + ref.id, () => ref.set(doc));
    } else if (it.action === 'terminer'){
      res = await write('t:' + it.id, () => tasksCol().doc(it.id).update({ statut:'fait', faitLe:now, faitJour:S.today, modifieLe:now }));
    } else if (it.action === 'terminer_routine'){
      const r = S.routines.get(it.id); const oid = it.id + '_' + S.today;
      res = S.occ.has(oid) ? true : await write('o:' + oid, () => occCol().doc(oid).set({ routineId:it.id, date:S.today, titre:r ? r.titre : '', rubrique:r ? r.rubrique : '', faitLe:now }));
    } else if (it.action === 'modifier'){
      const t = S.tasks.get(it.id) || {};
      const p = { modifieLe:now };
      if (it.titre && it.titre !== t.titre) p.titre = it.titre;
      ['type','rubrique','sous','echeance','heure','niveau','duree'].forEach(k => { if (it[k]) p[k] = it[k]; });
      if (it.action_suivante) p.action = it.action_suivante;
      if (it.prevue){ p.prevue = it.prevue; if (t.prevue && it.prevue > t.prevue) p.reports = (t.reports || 0) + 1; }
      if (it.raison) p.raison = it.raison;
      p.suggere = Object.assign({}, t.suggere || {}, it.suggere);
      res = await write('t:' + it.id, () => tasksCol().doc(it.id).update(p));
    } else if (it.action === 'creer_routine'){
      const ref = routCol().doc();
      res = await write('r:' + ref.id, () => ref.set({ titre:it.titre, rubrique:it.rubrique || 'maison', frequence:normFreq(it.frequence), sous:it.sous, actif:true, debut:S.today, creeLe:now, modifieLe:now, source:rev.source }));
    } else if (it.action === 'garder'){
      const ref = col('idees').doc();
      res = await write('i:' + ref.id, () => ref.set({ texte:it.titre, rubrique:it.rubrique && it.rubrique !== 'inbox' ? it.rubrique : null, statut:'open', source:rev.source, creeLe:now, modifieLe:now }));
    } else if (it.action === 'friction'){
      if (it.id && S.frictions.has(it.id)){ const f = S.frictions.get(it.id); res = await write('f:' + it.id, () => col('frictions').doc(it.id).update({ mentions:(f.mentions || 1) + 1, derniereMention:now, statut:f.statut === 'solved' ? 'open' : (f.statut || 'open') })); }
      else { const ref = col('frictions').doc(); res = await write('f:' + ref.id, () => ref.set({ probleme:it.titre, rubrique:it.rubrique && it.rubrique !== 'inbox' ? it.rubrique : null, mentions:1, statut:'open', idee:null, creeLe:now, derniereMention:now })); }
    } else if (it.action === 'projet'){
      const ref = col('projets').doc();
      res = await write('p:' + ref.id, () => ref.set({ titre:it.titre, rubrique:it.rubrique || 'maison', horizon:it.horizon || 'soon', statut:'actif', note:'', creeLe:now, modifieLe:now }));
    }
    if (res){ ok++; it.inclus = false; it.enregistre = true; }
    else break;
  }
  if (ok < items.length){
    rev.elements = rev.elements.filter(x => !x.enregistre);
    renderSheet();
    if (ok) toast(ok + ' saved, the rest couldn’t be. Try again.');
    return;
  }
  if (rev.saisieId) write('s:' + rev.saisieId, () => col('saisies').doc(rev.saisieId).delete());
  if (rev.fallback && rev.scope && !rev.saisieId) clearDraft(rev.scope);
  S.followup = null;
  closeSheet();
  toast(ok === 1 ? 'Saved' : ok + ' things saved');
}

/* Break into steps: a quick call; the steps land in the open task sheet, editable, and are saved with it. */
async function suggestSteps(){
  const s = S.sheet; if (!s || s.kind !== 'task') return;
  if (S.sample === undefined && S.sampleP){ try { S.sample = await S.sampleP; } catch(e){ S.sample = null; } }
  if (!S.sample){ s.stepsMsg = 'The assistant isn’t available here. You can add steps yourself.'; renderSheet(); return; }
  const d = s.draft;
  s.stepsBusy = true; s.stepsMsg = ''; renderSheet();
  try {
    const res = await S.sample.json(`Break this task into 3 to 5 small, concrete steps of about 5 to 15 minutes each, so that starting feels easy. The first step must be very easy. Plain English, short, each starting with a verb. No advice, no motivation.
Task: ${d.titre}
Area: ${rubLabel(d.rubrique)}${d.note ? '\nNote: ' + String(d.note).slice(0, 600) : ''}${d.echeance ? '\nDeadline: ' + d.echeance : ''}
Reply with only JSON: {"steps":["…","…"]}`, { modelTier:'quick' });
    const steps = (res && Array.isArray(res.steps) ? res.steps : []).map(x => clean(String(x), 160)).filter(Boolean).slice(0, 6);
    if (S.sheet === s){
      if (steps.length){ d.etapes = (d.etapes || []).filter(x => x.t).concat(steps.map(t => ({ t, fait:false }))); s.stepsMsg = 'Suggested steps added. Edit or remove any, then save.'; }
      else s.stepsMsg = 'No steps came back. You can add them yourself.';
    }
  } catch(e){
    if (S.sheet === s) s.stepsMsg = e && e.code === 'rate_limited' ? 'The assistant has reached a usage limit for now.' : AI_OFF.includes(e && e.code) ? 'The assistant isn’t allowed to answer here.' : 'That didn’t work this time. You can try again or add steps yourself.';
  } finally {
    s.stepsBusy = false;
    if (S.sheet === s) renderSheet();
  }
}

/* Make life easier: one simple idea, using what she already has first. Only on request. */
async function frictionIdea(id){
  const f = S.frictions.get(id); if (!f) return;
  S.easyStatus = S.easyStatus || {};
  if (S.sample === undefined && S.sampleP){ try { S.sample = await S.sampleP; } catch(e){ S.sample = null; } }
  if (!S.sample){ S.easyStatus[id] = 'The assistant isn’t available here.'; render(); return; }
  S.easyStatus[id] = '<span class="spin"></span>Thinking of something simple…'; render();
  try {
    const res = await S.sample.json(`Samah keeps running into this practical problem at home: "${f.probleme}" (mentioned ${f.mentions || 1} times). She has a young child (Joud), studies, and limited time and energy.
${f.idee ? 'An earlier idea she did not keep: "' + f.idee + '". Suggest something different.\n' : ''}${(S.settings && S.settings.contexte) ? 'About her: ' + String(S.settings.contexte).slice(0, 800) + '\n' : ''}Suggest ONE simple, low-maintenance change to her surroundings or habits that would stop this coming back. Prefer using things she already has. Suggest buying something only if it is clearly useful and inexpensive. No complex systems, no new chores, no lists of options.
Reply with only JSON: {"idea":"one or two short sentences","first_step":"a 5-minute first step","purchase":null}`, { modelTier:'default', cache:false });
    const idee = clean(res && res.idea, 300);
    if (!idee) throw { code:'empty' };
    S.easyStatus[id] = '';
    await write('f:' + id, () => col('frictions').doc(id).update({ idee, premierPas:clean(res.first_step, 200) || null, achat:clean(res.purchase || '', 120) || null, statut:'open', modifieLe:nowIso() }));
  } catch(e){
    S.easyStatus[id] = e && e.code === 'rate_limited' ? 'The assistant has reached a usage limit for now.' : 'That didn’t work this time. Try again later.';
  } finally { render(); }
}

/* ---------------- Tips ----------------
   At most one tip a day on Today, only when it fits, never in “Too much right now” or on a full day.
   Two sources: a small library tied to her situation, and signals in her own data (computed here,
   on her account, never sent anywhere unless she asks for an idea). Her answers are kept in `astuces`:
   tried / later (with a date) / no — a “no” never comes back. */
const TIPS = [
  { id:'bag-night', area:'joud', title:'Pack Joud’s bag the night before', text:'Mornings get lighter when the bag is ready by the door before bed.', act:{ kind:'routine', titre:'Pack Joud’s bag for tomorrow', rubrique:'joud', frequence:{ type:'quotidien' } } },

  { id:'mail-weekly', area:'demarches', title:'Open the mail once a week', text:'One fixed moment for letters and bills, instead of a pile that grows quietly.', act:{ kind:'routine', titre:'Open the mail', rubrique:'demarches', frequence:{ type:'hebdo' } } },
  { id:'study-same-time', area:'etudes', title:'Same time, same place for studies', text:'A short study block at a regular time and spot needs less willpower to start.', act:{ kind:'routine', titre:'20 minutes of studies', rubrique:'etudes', frequence:{ type:'jours', jours:[2,4] } } },
  { id:'two-minutes', area:'maison', title:'Under two minutes? Do it now', text:'Tiny things done straight away never need to be remembered.', act:{ kind:'none' } },
  { id:'study-company', area:'etudes', title:'Study alongside someone', text:'A friend, a library or an online study room: working next to someone makes starting easier.', act:{ kind:'task', titre:'Find a place or person to study alongside', rubrique:'etudes', duree:15 } },
  { id:'evening-reset', area:'maison', title:'A 10-minute evening reset', text:'One room, ten minutes, timer on. Then stop, even if it isn’t perfect.', act:{ kind:'routine', titre:'10-minute reset of one room', rubrique:'maison', frequence:{ type:'quotidien' } } },
  { id:'me-appointment', area:'moi', title:'Book time for yourself like an appointment', text:'An hour a week for you, written down like any other appointment, is easier to protect.', act:{ kind:'routine', titre:'An hour for myself', rubrique:'moi', frequence:{ type:'hebdo' } } },
  { id:'joud-spots', area:'joud', title:'Fixed places for Joud’s everyday things', text:'The things you search for most (hat, wipes, dummy) each get one home, close to where they’re used.', act:{ kind:'task', titre:'Give Joud’s most-searched things a fixed place', rubrique:'joud', duree:15 } },
  { id:'papers-folder', area:'demarches', title:'One folder for papers in progress', text:'Everything that still needs action goes in one folder or box. Nothing to hunt for.', act:{ kind:'task', titre:'Set up one folder for papers in progress', rubrique:'demarches', duree:15 } },
  { id:'phone-calendar', area:'demarches', title:'Let your phone ring for appointments', text:'This app can’t send reminders. Appointments with an alarm in your phone calendar won’t slip.', act:{ kind:'task', titre:'Add this week’s appointments to my phone calendar', rubrique:'demarches', duree:5 } },
  { id:'done-look', area:'moi', title:'Glance at Done in the evening', text:'Many small things get done and forgotten. Seeing them counts too.', act:{ kind:'none' } },
  { id:'visual-timer', area:'etudes', gadget:true, title:'A visual timer', text:'A timer that shows time running out makes a study block or getting ready easier to pace. Inexpensive, and useful for Joud later too.', act:{ kind:'buy', titre:'Visual timer', rubrique:'etudes', rayon:'stationery' } },
  { id:'door-board', area:'maison', gadget:true, title:'A small board by the door', text:'A whiteboard at the entrance for “don’t forget” items you see on the way out.', act:{ kind:'buy', titre:'Small whiteboard for the entrance', rubrique:'maison', rayon:'stationery' } },
  { id:'key-tracker', area:'maison', gadget:true, needs:'keys', title:'A tracker on your keys', text:'A small tag you can ring from your phone. Worth it only if keys keep going missing.', act:{ kind:'buy', titre:'Key tracker tag', rubrique:'maison', rayon:'other' } }
];
const tipState = id => (S.astuces && S.astuces.get(id)) || null;
const tipsOff = () => !!(S.settings && S.settings.tipsOff);
function tipAvailable(id){
  const st = tipState(id);
  if (!st) return true;
  if (st.statut === 'later') return !st.until || st.until <= S.today;
  return false;
}
/* Signals from her own data. Each returns a tip with a plain reason, or null. */
function signalTips(){
  const out = [], tasks = allTasks(), td = S.today;
  const moved = tasks.filter(t => isOpenAct(t) && (t.reports || 0) >= 3 && !(Array.isArray(t.etapes) && t.etapes.length)).sort((a, b) => (b.reports || 0) - (a.reports || 0))[0];
  if (moved) out.push({ id:'sig-steps-' + moved.id, title:'Make it smaller', text:'When something keeps moving, the first step is often too big. Splitting it into small steps makes starting easier.', why:`“${moved.titre}” has been moved ${moved.reports} times.`, act:{ kind:'steps', id:moved.id }, tryLabel:'Break into steps' });
  for (const r of activeRoutines()){
    const f = freqOf(r);
    if (f.type !== 'quotidien' || !r.debut || diffDays(r.debut, td) < 14) continue;
    const n = (S.occBy.get(r.id) || []).filter(d => d > addDays(td, -14)).length;
    if (n <= 4){ out.push({ id:'sig-rhythm-' + r.id, title:'A lighter rhythm can work better', text:'A routine that fits real life beats a perfect one. Two or three days a week is fine.', why:`“${r.titre}” is set for every day and was ticked ${n} time${n === 1 ? '' : 's'} in two weeks.`, act:{ kind:'routine-edit', id:r.id }, tryLabel:'Adjust the rhythm' }); break; }
  }
  const usual = tasks.find(t => t.type === 'achat' && !t.recurrent && (t.fois || 0) >= 2);
  if (usual) out.push({ id:'sig-usual-' + usual.id, title:'Keep regular items one tap away', text:'Things you buy often can wait in “Usual items” and come back to the list with one tap.', why:`You’ve bought “${usual.titre}” ${usual.fois} times.`, act:{ kind:'usual', id:usual.id }, tryLabel:'Make it a usual item' });
  const waitOld = tasks.find(t => t.statut === 'en_attente' && t.modifieLe && diffDays(isoOf(new Date(t.modifieLe)), td) >= 10);
  if (waitOld) out.push({ id:'sig-follow-' + waitOld.id, title:'A short follow-up', text:'A two-line message is often enough to get things moving again.', why:`“${waitOld.titre}” has been waiting for over ten days.`, act:{ kind:'task', titre:'Follow up: ' + waitOld.titre, rubrique:waitOld.rubrique, duree:5 }, tryLabel:'Add a follow-up' });
  const inboxN = tasks.filter(t => t.rubrique === 'inbox' && isOpenAct(t)).length;
  if (inboxN >= 6) out.push({ id:'sig-inbox', title:'Sort the Inbox in one go', text:'Unsorted things weigh more than sorted ones. The assistant can file them all at once.', why:`${inboxN} things are waiting in the Inbox.`, act:{ kind:'sort-inbox' }, tryLabel:'Sort it now' });
  const recent = tasks.filter(t => t.creeLe && t.source !== 'manual-import' && new Date(t.creeLe) > new Date(Date.now() - 14 * 864e5));
  const late = recent.filter(t => new Date(t.creeLe).getHours() >= 19).length;
  if (recent.length >= 8 && late / recent.length >= 0.6) out.push({ id:'sig-evening', title:'A 5-minute “tomorrow” moment', text:'You often note things in the evening. Five minutes to glance at tomorrow can make mornings calmer.', why:'Most of your notes in the last two weeks were added after 7 pm.', act:{ kind:'routine', titre:'Look at tomorrow (5 min)', rubrique:'moi', frequence:{ type:'quotidien' } } });
  const from = addDays(td, -14);
  const doneIn = k => tasks.filter(t => t.rubrique === k && t.statut === 'fait' && t.faitJour >= from).length;
  if (doneIn('joud') >= 6 && doneIn('etudes') + doneIn('moi') <= 1 && quietDays('etudes') >= 7) out.push({ id:'sig-balance', area:'etudes', title:'Protect one small study slot', text:'When daily needs fill every day, a short fixed slot keeps studies from disappearing. Small is enough.', why:'Lots done for Joud in two weeks, very little for Studies or yourself.', act:{ kind:'routine', titre:'20 minutes of studies', rubrique:'etudes', frequence:{ type:'jours', jours:[2,4] } } });
  return out.filter(x => tipAvailable(x.id));
}
function hasKeysProblem(){ return Array.from(S.frictions.values()).some(f => /key/i.test(f.probleme || '') && f.statut !== 'solved'); }
function libraryTips(){
  const lastGadget = LS.get('ms.lastGadget', '');
  return TIPS.filter(t => tipAvailable(t.id) && (!t.needs || (t.needs === 'keys' && hasKeysProblem())) && (!t.gadget || !lastGadget || diffDays(lastGadget, S.today) >= 7))
    .map(t => Object.assign({}, t, { why: t.needs === 'keys' ? 'You’ve mentioned losing your keys.' : `An idea for ${rubLabel(t.area)}, picked for days with a young child and studies.` }));
}
/* Today’s tip: stable for the whole day once chosen. Signals come first. */
function tipOfDay(){
  if (tipsOff()) return null;
  const k = 'ms.tip.' + S.today, chosen = LS.get(k, null);
  const all = signalTips().concat(libraryTips()).concat(aiTips());
  if (chosen){ const t = all.find(x => x.id === chosen); if (t) return t; if (LS.get(k + '.answered', false)) return null; }
  const sig = signalTips();
  let t = sig[0];
  if (!t){ const lib = libraryTips(); if (lib.length){ const n = Math.floor(parseISO(S.today).getTime() / 864e5); t = lib[n % lib.length]; } }
  if (t){ LS.set(k, t.id); if (t.gadget) LS.set('ms.lastGadget', S.today); }
  return t || null;
}
function aiTips(){ return Array.from((S.astuces || new Map()).values()).filter(x => x.source === 'ai' && x.statut === 'new').map(x => Object.assign({ id:x.id }, x.tip || {}, { why:(x.tip && x.tip.why) || 'Suggested by the assistant from your recent activity.' })); }
function tipCard(t, ctx){
  ctx = ctx || {};
  const open = S.tipWhy === t.id;
  const label = t.tryLabel || ({ routine:'Add this routine', task:'Add it as a task', buy:'Add to Shopping', none:'Good idea', 'routine-edit':'Adjust', usual:'Make it usual', steps:'Break into steps', 'sort-inbox':'Sort it now' })[(t.act || {}).kind] || 'Try it';
  return `<div class="card tip"><span class="eyebrow-s">${ctx.label || 'Tip'}${t.gadget ? ' · something that could help' : ''}</span><strong>${esc(t.title)}</strong><span>${esc(t.text)}</span>
    <button class="linkbtn" style="justify-self:start" data-act="tip-why" data-id="${esc(t.id)}" aria-expanded="${open}">Why am I seeing this?</button>
    ${open ? `<p class="small" style="margin:0">${esc(t.why || '')}</p>` : ''}
    ${S.readOnly ? '' : `<div class="acts"><button class="btn primary small" data-act="tip-try" data-id="${esc(t.id)}">${esc(label)}</button><button class="btn ghost small" data-act="tip-later" data-id="${esc(t.id)}">Later</button><button class="linkbtn" data-act="tip-no" data-id="${esc(t.id)}">Not for me</button></div>`}</div>`;
}
const findTip = id => signalTips().concat(libraryTips(), aiTips(), TIPS).find(t => t.id === id);
async function tipAnswer(id, statut, extra){
  LS.set('ms.tip.' + S.today + '.answered', true);
  const t = findTip(id) || {};
  const doc = Object.assign({}, tipState(id) || {}, { statut, date:S.today, titre:t.title || '', modifieLe:nowIso() }, extra || {});
  return write('a:' + id, () => col('astuces').doc(id).set(doc));
}
function tipTry(id){
  const t = findTip(id); if (!t) return;
  const a = t.act || { kind:'none' };
  tipAnswer(id, 'tried');
  if (a.kind === 'routine') openRoutine(null, { titre:a.titre, rubrique:a.rubrique, frequence:JSON.parse(JSON.stringify(a.frequence)) });
  else if (a.kind === 'task') openSheet({ kind:'task', isNew:true, draft:newTaskDraft({ titre:a.titre, rubrique:a.rubrique, duree:a.duree || null }) });
  else if (a.kind === 'buy') openSheet({ kind:'task', isNew:true, draft:newTaskDraft({ titre:a.titre, rubrique:a.rubrique, type:'achat', rayon:a.rayon || null }) });
  else if (a.kind === 'steps'){ openTask(a.id); suggestSteps(); }
  else if (a.kind === 'routine-edit') openRoutine(a.id);
  else if (a.kind === 'usual') write('t:' + a.id, () => tasksCol().doc(a.id).update({ recurrent:true, modifieLe:nowIso() }), 'Now a usual item');
  else if (a.kind === 'sort-inbox') organize('ranger');
  else toast('Noted');
}

function renderTips(){
  let h = `<p class="quiet">Small, practical ideas. Try what fits, skip the rest: a “Not for me” never comes back.</p>`;
  if (tipsOff()) h += `<div class="card soft" style="margin-top:12px">Tips are turned off on Today. You can still browse them here, or turn them back on in Settings.</div>`;
  const sig = signalTips(), ai = aiTips();
  if (!S.readOnly) h += `<div class="morelinks" style="margin-top:12px"><button class="btn primary" data-act="tip-ai"${S.tipBusy ? ' disabled' : ''}>${S.tipBusy ? '<span class="spin"></span>Thinking…' : 'Give me an idea'}</button></div>${S.tipMsg ? `<p class="small">${esc(S.tipMsg)}</p>` : ''}`;
  if (ai.length) h += `<section class="sec"><h2 class="sec-h">From the assistant</h2><div class="notes">${ai.map(t => tipCard(t, { label:'Idea for you' })).join('')}</div></section>`;
  if (sig.length) h += `<section class="sec"><h2 class="sec-h">Based on your days</h2><div class="notes">${sig.map(t => tipCard(t, { label:'Noticed' })).join('')}</div></section>`;
  const lib = libraryTips();
  const byArea = new Map();
  lib.forEach(t => { if (!byArea.has(t.area)) byArea.set(t.area, []); byArea.get(t.area).push(t); });
  if (lib.length){
    h += `<section class="sec"><h2 class="sec-h">Ideas to browse</h2>`;
    byArea.forEach((arr, k) => { const o = isFold('tips-' + k, false); h += `${foldHead('tips-' + k, rubLabel(k), arr.length, false, true)}${o ? `<div class="notes" style="margin-bottom:12px">${arr.map(t => tipCard(t)).join('')}</div>` : ''}`; });
    h += `</section>`;
  }
  const tried = Array.from((S.astuces || new Map()).values()).filter(x => x.statut === 'tried');
  if (tried.length){ const o = isFold('tips-tried', false); h += `<section class="sec">${foldHead('tips-tried', 'Ideas you’ve tried', tried.length, false)}${o ? `<ul class="list">${tried.map(x => `<li class="row fr"><span class="donebadge">${ICON.check}</span><span class="fr-text"><span class="row-title">${esc(x.titre || (x.tip && x.tip.title) || '')}</span><span class="row-meta"><span class="m">${x.date ? fmtRel(x.date) : ''}</span></span></span></li>`).join('')}</ul>` : ''}</section>`; }
  const no = Array.from((S.astuces || new Map()).values()).filter(x => x.statut === 'no');
  if (no.length && !S.readOnly) h += `<p class="small" style="margin-top:18px">${no.length} idea${no.length > 1 ? 's' : ''} set aside. <button class="linkbtn" data-act="tips-reset">Show them again</button></p>`;
  return h;
}

/* “Give me an idea”: one tip from the assistant, using a short summary of her real activity. */
async function aiTip(){
  if (S.tipBusy) return;
  if (S.sample === undefined && S.sampleP){ try { S.sample = await S.sampleP; } catch(e){ S.sample = null; } }
  if (!S.sample){ S.tipMsg = 'The assistant isn’t available here.'; render(); return; }
  S.tipBusy = true; S.tipMsg = ''; render();
  const tasks = allTasks(), from = addDays(S.today, -14);
  const areaLine = visibleRubs().map(r => `${r.label}: ${tasks.filter(t => t.rubrique === r.key && isOpenAct(t)).length} open, ${tasks.filter(t => t.rubrique === r.key && t.statut === 'fait' && t.faitJour >= from).length} done in 14 days`).join('; ');
  const movedN = tasks.filter(t => isOpenAct(t) && (t.reports || 0) >= 2).length;
  const fr = Array.from(S.frictions.values()).filter(f => f.statut !== 'dismissed').map(f => f.probleme).slice(0, 8).join('; ');
  const answered = Array.from((S.astuces || new Map()).values());
  const liked = answered.filter(x => x.statut === 'tried').map(x => x.titre).filter(Boolean).slice(-10).join('; ');
  const disliked = answered.filter(x => x.statut === 'no').map(x => x.titre).filter(Boolean).slice(-15).join('; ');
  try {
    const res = await S.sample.json(`Suggest ONE practical organisation tip for Samah: a mother of a young child (Joud), a student at UNIL, who also handles paperwork and the household. Prefer concrete changes to her surroundings or routine (visual cues, fixed places, small regular moments, "when X, then Y") over motivation. Warm, adult tone; no coaching phrases, no clinical words, no guilt. Suggest buying something only if clearly useful and inexpensive.
Her activity: ${areaLine}. Tasks moved twice or more: ${movedN}.
${fr ? 'Recurring problems: ' + fr + '.\n' : ''}${(S.settings && S.settings.contexte) ? 'About her: ' + String(S.settings.contexte).slice(0, 800) + '\n' : ''}${liked ? 'Ideas she liked: ' + liked + '.\n' : ''}${disliked ? 'Ideas she did not want (avoid similar): ' + disliked + '.\n' : ''}
Reply with only JSON: {"title":"short title","text":"one or two short sentences","why":"one sentence linking it to her activity above","action":{"kind":"routine|task|buy|none","title":"short, starts with a verb (or the item to buy)","area":"maison|etudes|joud|demarches|moi","frequency":{"type":"daily|days|weekly","days":[1,4]}}}`, { modelTier:'default', cache:false });
    const a = res && res.action || {};
    const keys = visibleRubs().map(r => r.key);
    const kind = ['routine','task','buy','none'].includes(a.kind) ? a.kind : 'none';
    const area = keys.includes(a.area) ? a.area : 'maison';
    const tip = { title:clean(res && res.title, 80), text:clean(res && res.text, 300), why:clean(res && res.why, 200), area,
      act:{ kind, titre:clean(a.title, 120) || clean(res && res.title, 80), rubrique:area, frequence:normFreq(a.frequency), duree:kind === 'task' ? 15 : null } };
    if (!tip.title || !tip.text) throw { code:'empty' };
    const id = 'ai-' + Date.now().toString(36);
    await write('a:' + id, () => col('astuces').doc(id).set({ source:'ai', statut:'new', tip, titre:tip.title, date:S.today, creeLe:nowIso() }));
  } catch(e){
    S.tipMsg = e && e.code === 'rate_limited' ? 'The assistant has reached a usage limit for now.' : AI_OFF.includes(e && e.code) ? 'The assistant isn’t allowed to answer here.' : 'That didn’t work this time. Try again later.';
  } finally { S.tipBusy = false; render(); }
}

let toastT = 0;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 2800); }

function addShopping(){
  const inp = $('#shopAdd'); if (!inp) return;
  const parts = inp.value.split(/,|\n| and /i).map(x => clean(x, 120)).filter(Boolean).slice(0, 20);
  if (!parts.length){ inp.focus(); return; }
  const area = S.shopArea || 'maison', now = nowIso();
  const openBy = new Map(allTasks().filter(t => t.type === 'achat').map(t => [norm(t.titre), t]));
  const dup = [];
  (async () => {
    for (const p of parts){
      const m = p.match(/^(\d+\s*[a-z]{0,6}x?)\s+(.+)$/i);
      const titre = cap1(m ? m[2] : p), qte = m ? m[1] : null;
      const ex = openBy.get(norm(titre));
      if (ex && isOpenAct(ex)){ dup.push(titre); continue; }
      if (ex && ex.statut === 'fait'){ await write('t:' + ex.id, () => tasksCol().doc(ex.id).update({ statut:'a_faire', faitLe:null, faitJour:null, qte:qte || ex.qte || null, modifieLe:now })); continue; }
      const ref = tasksCol().doc();
      await write('t:' + ref.id, () => ref.set({ titre, qte, rayon:guessAisle(titre), rubrique:area, type:'achat', prevue:null, echeance:null, heure:null, importance:1, niveau:null, duree:null, statut:'a_faire', magasin:null, recurrent:false, etapes:[], action:null, suggere:{}, source:'manual', creeLe:now, modifieLe:now, reports:0, faitLe:null, faitJour:null }));
    }
    inp.value = ''; LS.del('ms.draft.shop');
    toast(dup.length ? 'Already on the list: ' + dup.join(', ') : 'Added');
  })();
}
async function addSimple(inputId, draft, colName, makeDoc, msg){
  const inp = $('#' + inputId); if (!inp) return;

  const ref = col(colName).doc();
  if (await write(colName + ':' + ref.id, () => ref.set(makeDoc(v)), msg)){ inp.value = ''; LS.del('ms.draft.' + draft); }
}

document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset && el.dataset.draft) LS.set('ms.draft.' + el.dataset.draft, el.value);
  const f = el.dataset && el.dataset.f;
  if (!f || !S.sheet) return;
  const s = S.sheet;
  if (s.kind === 'task' || s.kind === 'routine' || s.kind === 'project'){
    if (f === 'intervalle'){ s.draft.frequence = Object.assign({}, s.draft.frequence, { intervalle:Number(el.value) }); return; }
    if (f === 'step'){ const st = s.draft.etapes[Number(el.dataset.i)]; if (st) st.t = el.value; return; }
    s.draft[f] = el.value === '' ? null : el.value;
    if (s.draft.suggere && ({ prevue:1, echeance:1 })[f]) delete s.draft.suggere[f];
    if (f === 'prevue') document.querySelectorAll('[data-act="set"][data-k="prevue"]').forEach(b => b.setAttribute('aria-pressed', String((b.dataset.v || null) === (s.draft.prevue || null))));
  } else if (s.kind === 'settings'){
    if (f === 'rub-label') s.draft.rubriques[Number(el.dataset.i)].label = el.value;
    else s.draft[f] = el.value;
  } else if (s.kind === 'review'){
    const it = s.rev.elements[Number(el.dataset.i)];
    if (f === 'rv-titre') it.titre = el.value;
  }
});

});
document.addEventListener('focusout', () => { setTimeout(() => { if (pendingRender && !typing()) render(); }, 0); });

/* ---------------- Data ---------------- */
let daySub = null;
function subDay(){
  if (daySub){ try { daySub(); } catch(e){} daySub = null; }
  const iso = S.today;
  try { daySub = S.db.doc('jours/' + iso).onSnapshot(snap => { S.day = snap.exists ? Object.assign({ date:iso }, snap.data()) : null; render(); }, () => {}); } catch(e){}
}
function tick(){ const t = todayISO(); if (t !== S.today){ S.today = t; if (S.db) subDay(); render(); } }
setInterval(tick, 60000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) tick(); });

function subscribe(){
  const onErr = name => e => {
    const code = e && e.code;
    if (code === 'revoked'){ S.revoked = true; S.readOnly = true; render(); }
    else if (code === 'unavailable'){ setTimeout(() => sub(name), 3000); }
  };
  const mapOf = snap => new Map(snap.docs.map(d => [d.id, Object.assign({}, d.data(), { id:d.id })]));
  const subs = {
    taches: () => tasksCol().onSnapshot(snap => { S.tasks = mapOf(snap); S.loaded.taches = true; render(); }, onErr('taches')),
    routines: () => routCol().onSnapshot(snap => { S.routines = mapOf(snap); S.loaded.routines = true; render(); }, onErr('routines')),
    occurrences: () => occCol().where('date', '>=', addDays(S.today, -120)).onSnapshot(snap => {
      S.occ = new Map(); const by = new Map();
      snap.docs.forEach(d => { const o = Object.assign({}, d.data(), { id:d.id }); if (!o.routineId || !isISO(o.date)) return; S.occ.set(d.id, o); if (!by.has(o.routineId)) by.set(o.routineId, []); by.get(o.routineId).push(o.date); });
      by.forEach(arr => arr.sort()); S.occBy = by; render();
    }, onErr('occurrences')),
    saisies: () => col('saisies').onSnapshot(snap => { S.saisies = mapOf(snap); render(); }, onErr('saisies')),
    idees: () => col('idees').onSnapshot(snap => { S.idees = mapOf(snap); render(); }, onErr('idees')),
    astuces: () => col('astuces').onSnapshot(snap => { S.astuces = mapOf(snap); render(); }, onErr('astuces')),
    projets: () => col('projets').onSnapshot(snap => { S.projets = mapOf(snap); render(); }, onErr('projets')),
    frictions: () => col('frictions').onSnapshot(snap => { S.frictions = mapOf(snap); render(); }, onErr('frictions')),
    reglages: () => S.db.doc('reglages/principal').onSnapshot(snap => { S.settings = snap.exists ? snap.data() : null; render(); }, onErr('reglages'))
  };
  const sub = name => { try { subs[name](); } catch(e){} };
  Object.keys(subs).forEach(sub);
  subDay();
}

async function init(){
  applyPrefs();
  route();
  doRender(true);
  if (!window.claude || typeof window.claude.use !== 'function'){ S.dbState = 'absent'; doRender(true); return; }
  S.sampleP = window.claude.use('sample');
  S.sampleP.then(x => { S.sample = x; }).catch(() => { S.sample = null; });
  window.claude.use('downloads').then(x => { S.downloads = x; }).catch(() => {});
  window.claude.use('user').then(async u => { if (!u) return; const w = await u.can('data.write'); if (w === false){ S.readOnly = true; render(); } }).catch(() => {});
  let db = null;
  try { db = await window.claude.use('db'); } catch(e){ db = null; }
  if (!db){ S.dbState = 'absent'; doRender(true); return; }
  S.db = db; S.dbState = 'ok';
  subscribe();
  render();
}
init();
})();
</script>
