<title>My space</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;500;600;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: phone = one calm column + bottom bar of four spaces (Today, Shopping, Plans, Done).
   Desktop (>=960px) = left sidebar + wider content; Today splits into two columns.
   Big type is the baseline, not a setting. Colour is used sparingly: area dots, deadlines, done. */
:root{
  --bg:#FBF6EF; --surface:#FFFFFF; --surface-2:#F6EEE4; --ink:#2A2438; --ink-2:#6A6176; --line:#ECE2D6;
  --accent:#6A5AC8; --accent-ink:#FFFFFF; --accent-soft:#EEEAFC;
  --done:#3B8A5A; --done-soft:#E2F2E8; --warm:#B85A26; --warm-soft:#FDE9DC;
  --hero:#FFF7EE; --sun:#F2A93B;
  --r-maison:#C0661C; --r-maison-s:#FDEEDD; --r-etudes:#5755C9; --r-etudes-s:#E9E9FB;
  --r-joud:#C14779; --r-joud-s:#FCE6EF; --r-demarches:#23808A; --r-demarches-s:#DDF1F2;
  --r-moi:#C23D5C; --r-moi-s:#FCE3E8; --r-inbox:#6E6878; --r-inbox-s:#EFECF1;
  --shadow:0 1px 2px rgba(80,50,20,.05),0 8px 24px rgba(80,50,20,.07);
  --overlay:rgba(30,20,40,.45);
  --font:"Atkinson Hyperlegible Next","Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --radius:18px;
  font-size:19px;
}
:root[data-size="large"]{font-size:21px}
:root[data-size="xlarge"]{font-size:23px}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#17141F; --surface:#221E2C; --surface-2:#2C2738; --ink:#F1ECF7; --ink-2:#B5ACC2; --line:#383146;
    --accent:#ADA1F5; --accent-ink:#1A1530; --accent-soft:#302A4A;
    --done:#7DCB98; --done-soft:#1E3326; --warm:#F4A878; --warm-soft:#3D271A;
    --hero:#241F30; --sun:#F2B656;
    --r-maison:#F2B27A; --r-maison-s:#3B2A1A; --r-etudes:#AFAEF5; --r-etudes-s:#27264A;
    --r-joud:#F2A2C3; --r-joud-s:#3D2030; --r-demarches:#8FD0D6; --r-demarches-s:#183437;
    --r-moi:#F2A0B2; --r-moi-s:#3D1E27; --r-inbox:#BDB6C8; --r-inbox-s:#2B2733;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.25);
    --overlay:rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#17141F; --surface:#221E2C; --surface-2:#2C2738; --ink:#F1ECF7; --ink-2:#B5ACC2; --line:#383146;
  --accent:#ADA1F5; --accent-ink:#1A1530; --accent-soft:#302A4A;
  --done:#7DCB98; --done-soft:#1E3326; --warm:#F4A878; --warm-soft:#3D271A;
  --hero:#241F30; --sun:#F2B656;
  --r-maison:#F2B27A; --r-maison-s:#3B2A1A; --r-etudes:#AFAEF5; --r-etudes-s:#27264A;
  --r-joud:#F2A2C3; --r-joud-s:#3D2030; --r-demarches:#8FD0D6; --r-demarches-s:#183437;
  --r-moi:#F2A0B2; --r-moi-s:#3D1E27; --r-inbox:#BDB6C8; --r-inbox-s:#2B2733;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.25);
  --overlay:rgba(0,0,0,.6);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg);color:var(--ink);font-family:var(--font);font-size:1rem;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
body.lock{overflow:hidden}
svg{width:1.25em;height:1.25em;flex:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.app{max-width:680px;margin:0 auto;padding-bottom:calc(150px + env(safe-area-inset-bottom,0px))}

/* Top bar */
.top{padding-block:12px 4px}
.top-row{display:flex;align-items:center;gap:10px;min-height:48px}
.eyebrow{margin:0;color:var(--ink-2);font-weight:600;font-size:.95rem;min-width:0}
.grow{flex:1}
h1{font-size:1.6rem;line-height:1.15;font-weight:700;margin:6px 0 0;letter-spacing:-.01em;text-wrap:balance;overflow-wrap:break-word}
.sub{margin:.2rem 0 0;color:var(--ink-2);font-size:.95rem}
.iconbtn{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);color:var(--ink);flex:none}
.iconbtn svg{width:24px;height:24px}
.backbtn{display:inline-flex;align-items:center;gap:4px;min-height:44px;padding:0 14px 0 8px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:.9rem}
.backbtn svg{width:20px;height:20px}
.donechip{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 14px;border-radius:999px;border:0;background:var(--done-soft);color:var(--done);font-weight:700;font-size:.9rem;font-variant-numeric:tabular-nums}
.donechip svg{width:20px;height:20px}
.banner{margin:4px 0 6px;padding:12px 14px;border-radius:14px;background:var(--warm-soft);color:var(--ink);font-size:.92rem}
.calmlink{background:none;border:0;padding:4px 0;color:var(--ink-2);font-size:.9rem;font-weight:600;text-decoration:underline;text-underline-offset:3px;min-height:40px}

/* Buttons */
.btn{min-height:48px;padding:0 20px;border-radius:999px;font-weight:700;border:1.5px solid transparent;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn svg{width:22px;height:22px}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--ink)}
.btn.small{min-height:40px;padding:0 14px;font-size:.88rem}
.btn:disabled{opacity:.5;cursor:default}
.linkbtn{background:none;border:0;padding:6px 0;color:var(--accent);font-weight:700;text-decoration:underline;text-underline-offset:3px;min-height:40px}
.danger{color:var(--warm)}
.acts{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* Quick add */
.capture{background:var(--surface);border:1.5px solid var(--line);border-radius:20px;padding:16px;display:grid;gap:10px}
.capture:focus-within{border-color:var(--accent)}
.cap-label{font-weight:700;font-size:1.08rem}
.cap-text{width:100%;border:0;resize:vertical;min-height:4.4em;font:inherit;font-size:1.05rem;line-height:1.45;background:var(--surface-2);border-radius:12px;padding:12px 14px;color:var(--ink)}
.cap-text::placeholder{color:var(--ink-2);opacity:.85}
.cap-foot{display:flex;align-items:center;justify-content:space-between;gap:10px 14px;flex-wrap:wrap}
.cap-hint{color:var(--ink-2);font-size:.84rem;display:flex;align-items:center;gap:6px;min-width:0}
.cap-hint svg{width:18px;height:18px}
.cap-status{font-size:.92rem;color:var(--ink);background:var(--surface-2);border-radius:12px;padding:10px 12px;display:grid;gap:8px}
.spin{display:inline-block;width:16px;height:16px;border-radius:50%;border:2.5px solid var(--line);border-top-color:var(--accent);animation:spin .9s linear infinite;vertical-align:-2px;margin-right:8px}
@keyframes spin{to{transform:rotate(360deg)}}

/* Sections and lists */
.sec{margin-top:28px}
.sec-h{display:flex;align-items:center;gap:10px;margin:0 0 10px;font-size:1.15rem;font-weight:700;line-height:1.25}
.sec-h .count,.fold .count{font-size:.88rem;font-weight:600;color:var(--ink-2);font-variant-numeric:tabular-nums}
.sec-sub{color:var(--ink-2);font-size:.9rem;margin:-4px 0 10px}
.fold{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;padding:6px 0;text-align:left;font-size:1.15rem;font-weight:700;min-height:44px}
.fold svg{width:22px;height:22px;margin-left:auto;transition:transform .2s;color:var(--ink-2)}
.fold[aria-expanded="true"] svg{transform:rotate(90deg)}
.fold.minor{font-size:1rem;color:var(--ink-2)}
.list{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:start;gap:4px 12px;padding:12px 14px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.chk{width:44px;height:44px;margin:-7px -4px -7px -6px;display:grid;place-items:center;background:none;border:0;padding:0}
.chk .box{width:30px;height:30px;border-radius:9px;border:2px solid var(--ink-2);display:grid;place-items:center;transition:background .15s,border-color .15s}
.chk.round .box{border-radius:50%}
.chk svg{width:20px;height:20px;stroke:var(--surface);stroke-width:3.2;fill:none;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.chk.on .box{background:var(--done);border-color:var(--done)}
.chk.on svg{opacity:1}
.chk:disabled{cursor:default}
.row-main{display:grid;gap:3px;min-width:0;background:none;border:0;padding:0;text-align:left;color:inherit}
.row-title{font-weight:600;font-size:1rem;line-height:1.35;overflow-wrap:anywhere}
.row.done .row-title{text-decoration:line-through;text-decoration-thickness:2px;color:var(--ink-2);font-weight:500}
.row-next{color:var(--ink-2);font-size:.9rem;overflow-wrap:anywhere}
.row.done .row-next{display:none}
.row-meta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:.84rem;color:var(--ink-2)}
.m{display:inline-flex;align-items:center;gap:5px}
.m svg{width:16px;height:16px}
.m.strong{color:var(--ink);font-weight:700}
.chip{display:inline-flex;align-items:center;gap:6px;padding:1px 10px;border-radius:999px;font-size:.8rem;font-weight:600;line-height:1.65;white-space:nowrap}
.chip.rub{background:var(--cs);color:var(--c)}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--c)}
.chip.warm{background:var(--warm-soft);color:var(--warm)}
.chip.acc{background:var(--accent-soft);color:var(--accent)}
.chip.ok{background:var(--done-soft);color:var(--done)}
.sugg{font-style:italic;font-weight:400}
.later{align-self:center;font-size:.84rem;min-height:40px;padding:0 12px;border-radius:999px;border:1.5px solid var(--line);background:transparent;font-weight:600;white-space:nowrap}
.later-row{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px;padding:6px 0 2px}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--radius);padding:16px;color:var(--ink-2);font-size:.95rem}
.quiet{color:var(--ink-2);font-size:.92rem;margin:0}
.prog{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin:-2px 0 12px}
.prog i{display:block;height:100%;background:var(--done);border-radius:99px;transition:width .3s}
.morelinks{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.small{font-size:.86rem;color:var(--ink-2)}

/* Today */
.today-grid{display:flex;flex-direction:column}
.col{display:contents}
.upnext{margin-top:14px;background:var(--surface);border:2px solid var(--accent);border-radius:22px;padding:18px 18px 16px;display:grid;gap:10px;box-shadow:var(--shadow)}
.eyebrow-s{margin:0;font-size:.8rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.un-row{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:start}
.un-title{font-size:1.3rem;font-weight:700;line-height:1.3;overflow-wrap:anywhere;background:none;border:0;padding:0;text-align:left;color:inherit}
.un-row.done .un-title{text-decoration:line-through;color:var(--ink-2)}
.un-step{margin:0;padding:10px 12px;border-radius:12px;background:var(--accent-soft);font-size:.95rem}
.enough{margin:12px 0 0;padding:12px 14px;border-radius:14px;background:var(--done-soft);color:var(--ink);font-size:.95rem;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;display:grid;gap:8px}
.card.soft{background:var(--surface-2);border-color:transparent}
.card.warm{background:var(--warm-soft);border-color:transparent}
.linkrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);text-align:left;width:100%}
.linkrow .rubicon{width:44px;height:44px}
.dayrow{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center}
.dayrow .lbl{font-weight:700;font-size:.92rem;min-width:4.2em}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips .choice{min-height:40px;padding:0 12px;font-size:.86rem}
.calmhead{margin-top:14px;padding:14px 16px;border-radius:16px;background:var(--surface-2);display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}

/* Plans */
.rublist{display:grid;gap:10px;margin-top:10px}
.rubrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);text-align:left;width:100%}
.rubicon{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:var(--cs,var(--accent-soft));color:var(--c,var(--accent))}
.rubicon svg{width:26px;height:26px}
.rubname{font-weight:700;font-size:1.08rem;line-height:1.25}
.rubcounts{color:var(--ink-2);font-size:.88rem;font-variant-numeric:tabular-nums}
.chev{width:22px;height:22px;color:var(--ink-2)}
.chev svg{width:100%;height:100%}
.seg{display:flex;background:var(--surface-2);border-radius:999px;padding:4px;gap:4px;margin:6px 0 14px}
.seg button{flex:1;min-height:44px;border-radius:999px;border:0;background:transparent;font-weight:600;color:var(--ink-2);font-size:.95rem}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.filters{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;margin-top:14px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.notes{display:grid;gap:10px}
.note{background:var(--surface);border:2px solid var(--accent);border-radius:var(--radius);padding:14px 16px;display:grid;gap:6px}
.note.wait{border:1.5px dashed var(--line)}
.note-text{margin:0;font-weight:600;overflow-wrap:anywhere}
.welcome{margin-top:20px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px;display:grid;gap:10px}
.welcome h2{margin:0;font-size:1.2rem}
.welcome p{margin:0;color:var(--ink-2)}

/* Week */
.weeknav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:6px}
.weeknav strong{font-size:1.05rem;text-align:center}
.day{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);margin-top:14px;overflow:hidden}
.day.today{border:2px solid var(--accent)}
.day.past{opacity:.85}
.day-h{display:flex;align-items:center;gap:8px 10px;padding:12px 14px 6px;flex-wrap:wrap}
.day-h strong{font-size:1.05rem}
.day-h .addday{margin-left:auto}
.day .list{border:0;border-radius:0;border-top:1px solid var(--line)}
.day-empty{padding:4px 14px 14px;color:var(--ink-2);font-size:.9rem}

/* Shopping */
.addline{display:grid;gap:8px;background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:12px}
.addline:focus-within{border-color:var(--accent)}
.store .row{padding:16px 14px}
.store .row-title{font-size:1.2rem}
.store .chk .box{width:36px;height:36px}
.qty{font-weight:700;color:var(--ink)}

/* Done */
.bars{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:110px;padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);margin-top:4px}
.bar{display:grid;grid-template-rows:auto 1fr auto;justify-items:center;height:100%;gap:4px;font-size:.78rem;color:var(--ink-2);font-variant-numeric:tabular-nums}
.bar .track{width:100%;max-width:30px;display:flex;align-items:flex-end;height:100%}
.bar .fill{width:100%;background:var(--done-soft);border:1.5px solid var(--done);border-radius:8px 8px 4px 4px;min-height:4px}
.bar.today{color:var(--ink);font-weight:700}
.dayhead{font-weight:700;font-size:1rem;margin:22px 0 8px;color:var(--ink)}
.donebadge{width:30px;height:30px;border-radius:50%;background:var(--done-soft);color:var(--done);display:grid;place-items:center}
.donebadge svg{width:18px;height:18px;stroke:currentColor;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
.row.fr{grid-template-columns:auto minmax(0,1fr)}
.fr-text{display:grid;gap:3px;min-width:0}
.fr-btn{grid-column:1/-1;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;align-items:start;background:none;border:0;padding:0;text-align:left;color:inherit}

/* Navigation */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.tabbar-in{max-width:680px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.brand{display:none}
.tab{display:grid;justify-items:center;gap:2px;padding:8px 2px 10px;min-height:64px;background:none;border:0;color:var(--ink-2);font-size:.8rem;font-weight:600}
.tab .ti{padding:3px 16px;border-radius:999px;display:grid;place-items:center}
.tab svg{width:26px;height:26px}
.tab[aria-current="page"]{color:var(--accent)}
.tab[aria-current="page"] .ti{background:var(--accent-soft)}
.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(80px + env(safe-area-inset-bottom,0px));z-index:9;min-height:52px;padding:0 20px;border-radius:999px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;display:inline-flex;align-items:center;gap:8px;box-shadow:var(--shadow)}
.fab svg{width:22px;height:22px}
.navquick{display:none}

/* Sheets */
.overlay{position:fixed;inset:0;background:var(--overlay);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-width:680px;margin:0 auto;max-height:92vh;max-height:92dvh;display:flex;flex-direction:column;
  background:var(--surface);border-radius:22px 22px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.18);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet-head,.sheet-body,.sheet-foot{padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.sheet-head{display:flex;align-items:center;gap:10px;padding-block:16px 8px}
.sheet-head h2{flex:1;margin:0;font-size:1.3rem;line-height:1.25}
.sheet-body{overflow:auto;padding-block:4px 18px;display:grid;gap:8px;overscroll-behavior:contain}
.sheet-foot{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;padding-block:12px;border-top:1px solid var(--line)}
.fl{font-weight:700;margin-top:12px;font-size:.95rem;display:block}
.hint{font-weight:400;color:var(--ink-2);font-size:.86rem}
.choices{display:flex;flex-wrap:wrap;gap:8px}
.choice{min-height:44px;padding:0 16px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font-size:.92rem;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.choice[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.choice .dot{width:9px;height:9px;border-radius:50%;background:var(--c,var(--ink-2))}
.field{width:100%;min-height:48px;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;font:inherit;font-size:1rem;background:var(--surface);color:var(--ink)}
textarea.field{resize:vertical;line-height:1.45}
.field.sm{min-height:44px;font-size:.92rem;padding:8px 10px}
.inline{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.inline .field{flex:1;min-width:150px}
.why{margin:6px 0 0;padding:10px 12px;border-radius:12px;background:var(--accent-soft);color:var(--ink);font-size:.9rem}
.why ul{margin:6px 0 0;padding-left:1.1em;display:grid;gap:4px}

.tagx{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 6px 0 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2);font-size:.84rem;font-weight:600}

.questions{padding:12px 14px;border-radius:14px;background:var(--accent-soft);display:grid;gap:6px}

.mv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 12px;padding:10px 0;border-top:1px solid var(--line)}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(82px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--bg);

/* Warm layer: greeting, hero card, tiles, week strip, aisles */
.greet{display:flex;align-items:center;gap:10px}
.greet .sun{width:34px;height:34px;color:var(--sun);flex:none}
.greet .sun svg{width:100%;height:100%}
.upnext{background:linear-gradient(160deg,var(--hero),var(--surface) 70%);border-color:var(--accent)}
.calmhead{background:var(--warm-soft)}
.today-grid .linkrow,.rubrow{box-shadow:var(--shadow);border-color:transparent}
.list{box-shadow:var(--shadow);border-color:transparent}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.tile{display:grid;gap:6px;justify-items:start;padding:14px;border-radius:var(--radius);background:var(--surface);border:0;box-shadow:var(--shadow);text-align:left;min-height:118px}
.tile .rubicon{width:44px;height:44px}
.tile .rubname{font-size:1rem}
.wstrip{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;background:var(--surface);border-radius:var(--radius);padding:10px 6px;box-shadow:var(--shadow)}
.wday{display:grid;justify-items:center;gap:2px;padding:6px 0 8px;border:0;background:none;border-radius:14px;color:var(--ink-2);font-size:.78rem;font-weight:600;min-height:64px}
.wday b{font-size:1.05rem;color:var(--ink)}
.wday i{width:6px;height:6px;border-radius:50%;background:transparent}
.wday.has i{background:var(--accent)}
.wday.now{background:var(--accent);color:var(--accent-ink)}

.wday.now.has i{background:var(--accent-ink)}
.aisle{font-size:1.15rem;margin-right:2px}
.tip{background:var(--hero);border-color:transparent;box-shadow:var(--shadow)}
.micbtn{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--accent);flex:none}

}

<script>
(function(){
'use strict';

/* ---------------- Utilities ---------------- */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clean = (s, n) => typeof s === 'string' ? s.replace(/\s+/g, ' ').trim().slice(0, n) : '';
const NB = ' ';
const LS = {
  get(k, d){ try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} },
  del(k){ try { localStorage.removeItem(k); } catch(e){} }
};

const DAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const DS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const MS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const pad = n => String(n).padStart(2, '0');
const isoOf = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const todayISO = () => isoOf(new Date());
function parseISO(s){ const p = String(s).split('-').map(Number); return new Date(p[0], p[1] - 1, p[2], 12); }
function addDays(s, n){ const d = parseISO(s); d.setDate(d.getDate() + n); return isoOf(d); }
function diffDays(a, b){ return Math.round((parseISO(b) - parseISO(a)) / 86400000); }
function wd(s){ const g = parseISO(s).getDay(); return g === 0 ? 7 : g; }
function mondayOf(s){ return addDays(s, 1 - wd(s)); }
function isISO(s){ return typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s) && !isNaN(parseISO(s).getTime()); }
const cap1 = s => s.charAt(0).toUpperCase() + s.slice(1);
function fmtLong(s){ const d = parseISO(s); return DAYS[d.getDay()] + ' ' + d.getDate() + ' ' + MONTHS[d.getMonth()]; }
function fmtShort(s){ const d = parseISO(s); return DS[d.getDay()] + NB + d.getDate() + NB + MS[d.getMonth()]; }
function fmtRel(s){
  const n = diffDays(S.today, s), d = parseISO(s);
  if (n === 0) return 'today';
  if (n === 1) return 'tomorrow';
  if (n === -1) return 'yesterday';
  if (n > 1 && n < 7) return DS[d.getDay()] + NB + d.getDate();
  const y = d.getFullYear() !== parseISO(S.today).getFullYear() ? ' ' + d.getFullYear() : '';
  return fmtShort(s) + y;
}
function fmtMin(m){ m = Math.round(m); if (m < 60) return m + NB + 'min'; const h = Math.floor(m / 60), r = m % 60; return h + NB + 'h' + (r ? NB + r + NB + 'min' : ''); }
const nowIso = () => new Date().toISOString();
const norm = s => String(s || '').toLowerCase().replace(/[^a-z0-9à-ÿ ]/g, '').replace(/\s+/g, ' ').trim();

/* ---------------- Icons ---------------- */
const sv = (p, w) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w || 2}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
const ICON = {

/* ---------------- Areas ----------------
   Internal keys stay as in the first version (maison, etudes, joud, demarches, moi, inbox),
   so data exported from it imports unchanged. Only labels are shown. */
const RUB_DEFAULT = [

];
const COLKEYS = ['maison','etudes','joud','demarches','moi','inbox'];

function rubriques(){
  const s = S.settings && Array.isArray(S.settings.rubriques) ? S.settings.rubriques : null;
  let list = (s && s.length) ? s.filter(r => r && typeof r.key === 'string' && typeof r.label === 'string') : RUB_DEFAULT.slice();
  if (!list.some(r => r.key === 'inbox')) list = list.concat([RUB_DEFAULT[5]]);
  return list.map(r => {
    const def = RUB_DEFAULT.find(d => d.key === r.key) || {};
    return { key:r.key, label:r.label, desc: r.desc != null && r.desc !== '' ? r.desc : (def.desc || ''), cache: !!r.cache };
  });
}
const visibleRubs = () => rubriques().filter(r => !r.cache || r.key === 'inbox');
const rubById = k => rubriques().find(r => r.key === k);
const rubLabel = k => (rubById(k) || {}).label || 'Inbox';
const rubStyle = k => COLKEYS.includes(k) ? `--c:var(--r-${k});--cs:var(--r-${k}-s)` : '--c:var(--accent);--cs:var(--accent-soft)';
const rubIcon = k => ICON[k] || ICON.autre;
const rubChip = k => `<span class="chip rub" style="${rubStyle(k)}"><i class="dot"></i>${esc(rubLabel(k))}</span>`;
const protectedAreas = () => (S.settings && Array.isArray(S.settings.proteger)) ? S.settings.proteger : ['etudes','moi'];

/* Shop aisles: purchases are grouped this way in the store. Guessed from the name, editable. */
const AISLES = [
  ['fruitveg','🥦','Fruit & veg',/\b(apple|banana|orange|lemon|tomato|potato|onion|carrot|salad|lettuce|fruit|veg|avocado|cucumber|pepper|berr|grape|pear|spinach|garlic|herb)/i],

  ['care','🧴','Personal care',/\b(shampoo|toothpaste|toothbrush|deodorant|razor|cream|lotion|tampon|pad|cotton|makeup)/i],
  ['pharmacy','💊','Pharmacy',/\b(paracetamol|ibuprofen|medicine|plaster|vitamin|syrup|thermometer|pharmacy)/i],
  ['stationery','✏️','Stationery',/\b(notebook|pen|pencil|paper|folder|stationery|highlighter|stapler|printer)/i],
  ['other','🛍️','Other',null]
];
const aisleOf = t => AISLES.find(a => a[0] === t.rayon) || AISLES.find(a => a[0] === guessAisle(t.titre));
function guessAisle(title){ const a = AISLES.find(x => x[3] && x[3].test(String(title || ''))); return a ? a[0] : 'other'; }
function greeting(){
  const h = new Date().getHours();

  return { text:(h < 12 ? 'Good morning' : h < 18 ? 'Good afternoon' : 'Good evening') + (name ? ', ' + name : ''), icon:h < 18 ? ICON.sun : ICON.moon };

/* ---------------- State ---------------- */
const S = {
  today: todayISO(),
  db: null, sample: undefined, sampleP: null, downloads: null,
  dbState: 'loading', readOnly: false, revoked: false,
  tasks: new Map(), routines: new Map(), occ: new Map(), occBy: new Map(), settings: null, saisies: new Map(),
  idees: new Map(), projets: new Map(), frictions: new Map(), astuces: new Map(), day: null,
  loaded: { taches:false, routines:false },
  view: 'today', rub: null, projet: null, rubTab: 'todo', sousFilter: null,
  weekOffset: 0, doneFilter: 7, doneRub: 'all', shopGroup: 'aisle', store: false,
  laterOpen: null, sheet: null, busy: null, followup: null, confirm: null,
  prefs: Object.assign({ size:'normal', showDone:true, open:{} }, LS.get('ms.prefs', {}))
};
const savePrefs = () => LS.set('ms.prefs', S.prefs);
function applyPrefs(){
  const r = document.documentElement;
  if (S.prefs.size === 'normal') r.removeAttribute('data-size'); else r.setAttribute('data-size', S.prefs.size);
}
const isFold = (k, def) => (k in S.prefs.open) ? !!S.prefs.open[k] : !!def;
const calmOn = () => LS.get('ms.calm', '') === S.today;
const skipped = () => LS.get('ms.skip.' + S.today, []);

/* ---------------- Tasks ---------------- */
const TYPES = ['tache','achat','rdv'];
const STATUTS = [['a_faire','To do'],['en_cours','In progress'],['en_attente','Waiting for'],['pause','Paused'],['fait','Done']];
const LEVELS = [['must','Must happen'],['worth','Worth doing'],['later','Can wait']];
const DURS = [[5,'5 min'],[15,'15 min'],[30,'30 min'],[60,'1 h'],[120,'2 h +']];
const isOpenAct = t => !t.statut || t.statut === 'a_faire' || t.statut === 'en_cours';
const isOpen = t => t.statut !== 'fait' && t.statut !== 'pause';
const dateOf = t => t.prevue || t.echeance || null;
const durOf = t => Number(t.duree) > 0 ? Number(t.duree) : (t.type === 'rdv' ? 60 : t.type === 'achat' ? 10 : 30);
const allTasks = () => Array.from(S.tasks.values());
const dayState = () => (S.day && S.day.date === S.today) ? S.day : {};
const AVAIL = { little:60, some:180, plenty:360 };

/* Today's candidates: planned for today or before, a hard deadline within 3 days,
   or flagged as must-happen / urgent without a date. Appointments and purchases are handled apart. */
function qualifies(t){
  if (t.type === 'rdv' || t.type === 'achat') return false;
  if (!isOpenAct(t)) return false;
  if (t.prevue && t.prevue <= S.today) return true;
  if (t.echeance && diffDays(S.today, t.echeance) <= 3) return true;
  if (!t.prevue && (t.urgence === 'haute' || t.niveau === 'must')) return true;
  return false;
}
function lastDoneIn(k){
  let last = null;
  for (const t of S.tasks.values()) if (t.rubrique === k && t.statut === 'fait' && t.faitJour && (!last || t.faitJour > last)) last = t.faitJour;
  for (const o of S.occ.values()){ const r = S.routines.get(o.routineId); const rb = r ? r.rubrique : o.rubrique; if (rb === k && (!last || o.date > last)) last = o.date; }
  return last;
}
function quietDays(k){ const l = lastDoneIn(k); return l ? diffDays(l, S.today) : 99; }

/* Priority = deadline pressure + must-happen + planned today + importance,
   plus a small, explained lift for a protected area (Studies, Me by default) that has been quiet.
   Being about Joud, being frequent or being recent adds nothing by itself. */
function scoreInfo(t, calm){
  const td = S.today, why = [];
  let s = 0;
  if (t.echeance){
    const d = diffDays(td, t.echeance);
    if (d < 0){ s += 100; why.push(`Its deadline was ${fmtRel(t.echeance)}. Dealing with it now clears it.`); }
    else if (d === 0){ s += 95; why.push('The deadline is today.'); }
    else if (d === 1){ s += 75; why.push('The deadline is tomorrow.'); }
    else if (d <= 3){ s += 50; why.push(`The deadline is ${fmtRel(t.echeance)}.`); }
    else if (d <= 7){ s += 25; why.push(`The deadline is ${fmtRel(t.echeance)}. Starting early keeps it light.`); }
  }
  if (t.niveau === 'must'){ s += 40; why.push('It’s marked as something that must happen.'); }
  else if (t.niveau === 'worth') s += 8;
  else if (t.niveau === 'later') s -= 25;
  if (t.prevue === td){ s += 25; if (!why.length) why.push('You planned it for today.'); }
  else if (t.prevue && t.prevue < td){ s += 18; if (!why.length) why.push(`It was planned for ${fmtRel(t.prevue)}.`); }
  if (t.importance === 3){ s += 25; why.push('It’s marked as very important.'); }
  else if (t.importance === 2) s += 12;
  if (t.urgence === 'haute') s += 15;
  if (protectedAreas().includes(t.rubrique) && quietDays(t.rubrique) >= 4 && !(t.echeance && diffDays(td, t.echeance) <= 1)){
    s += 15; why.push(`You haven’t had much time for ${rubLabel(t.rubrique)} lately, and this keeps it moving.`);
  }
  const ds = dayState(), dur = durOf(t);
  if (ds.energie === 'low' || calm){
    if (dur <= 15){ s += 10; why.push('It’s short, which suits a low-energy moment.'); }
    else if (dur > 45) s -= 20;
  }
  if (ds.temps === 'little' && dur > 60) s -= 25;
  if (t.statut === 'en_cours'){ s += 6; why.push('You’ve already started it.'); }
  if (!why.length) why.push('It’s on today’s list and nothing more pressing is waiting.');
  return { s, why: why.slice(0, 3) };
}
const score = t => scoreInfo(t).s;
function cmpDates(a, b){
  return (a.echeance || '9999').localeCompare(b.echeance || '9999') || (a.prevue || '9999').localeCompare(b.prevue || '9999') || String(a.creeLe || '').localeCompare(String(b.creeLe || ''));
}
const byScore = (a, b) => score(b) - score(a) || cmpDates(a, b);
const byHeure = (a, b) => (a.heure || '99').localeCompare(b.heure || '99');
const isFirm = t => t.type === 'rdv' || t.niveau === 'must' || (t.echeance && diffDays(S.today, t.echeance) <= 1);

/* What Today shows. Computed once per render. */
function todayModel(){
  const td = S.today, tasks = allTasks(), calm = calmOn(), skip = skipped();
  const cands = tasks.filter(qualifies);
  const sorted = cands.slice().sort((a, b) => scoreInfo(b, calm).s - scoreInfo(a, calm).s || cmpDates(a, b));
  let upnext = null;
  const pool = sorted.filter(t => !skip.includes(t.id));
  if (calm){
    const firm = pool.filter(isFirm);
    const base = firm.length ? firm : pool;
    upnext = base.slice().sort((a, b) => durOf(a) - durOf(b) || byScore(a, b))[0] || null;
  } else upnext = pool[0] || sorted[0] || null;
  const rdvToday = tasks.filter(t => t.type === 'rdv' && dateOf(t) === td && t.statut !== 'pause').sort(byHeure);
  const rdvTomorrow = tasks.filter(t => t.type === 'rdv' && isOpen(t) && dateOf(t) === addDays(td, 1)).sort(byHeure);
  const deadlines = tasks.filter(t => t.type !== 'rdv' && isOpenAct(t) && t.echeance && diffDays(td, t.echeance) <= 3 && (!upnext || t.id !== upnext.id)).sort(cmpDates);
  const mustBuy = tasks.filter(t => t.type === 'achat' && isOpenAct(t) && (t.niveau === 'must' && t.prevue && t.prevue <= td) && !deadlines.includes(t));
  const dmIds = new Set(deadlines.map(t => t.id));
  const also = sorted.filter(t => (!upnext || t.id !== upnext.id) && !dmIds.has(t.id));
  const doneToday = tasks.filter(t => t.statut === 'fait' && t.faitJour === td && t.type !== 'achat');
  const routs = routinesForDay(td);
  const openLoad = cands.reduce((n, t) => n + durOf(t), 0) + rdvToday.filter(t => t.statut !== 'fait').reduce((n, t) => n + durOf(t), 0);
  const ds = dayState();
  const avail = AVAIL[ds.temps] || null;
  const overloaded = avail ? openLoad > avail * 1.15 : (cands.length >= 8 || openLoad > 420);
  const doneMin = doneToday.reduce((n, t) => n + durOf(t), 0);
  const firmOpen = cands.filter(isFirm).length + rdvToday.filter(t => t.statut !== 'fait').length;
  const enough = doneToday.length > 0 && firmOpen === 0 && (!cands.length || (avail ? doneMin >= avail : doneToday.length >= 3));
  return { cands, sorted, upnext, rdvToday, rdvTomorrow, deadlines, mustBuy, also, doneToday, routs, openLoad, avail, overloaded, enough, calm };
}

/* Load of a given day, used to find calmer days when moving things. */
function dayLoad(d){
  let n = 0;
  for (const t of S.tasks.values()) if (isOpen(t) && t.statut !== 'en_attente' && dateOf(t) === d) n += durOf(t);
  return n;
}
function nextFreeDay(t){
  let best = null, bestLoad = Infinity;
  const lim = t && t.echeance ? addDays(t.echeance, -1) : null;
  for (let i = 1; i <= 7; i++){
    const d = addDays(S.today, i);
    if (lim && d > lim) break;
    const l = dayLoad(d);
    if (l < bestLoad){ best = d; bestLoad = l; }
  }
  return best || addDays(S.today, 1);
}

/* ---------------- Routines ---------------- */
function freqOf(r){ const f = r.frequence || {}; return ['quotidien','jours','hebdo','intervalle'].includes(f.type) ? f : { type:'quotidien' }; }
function freqLabel(r){
  const f = freqOf(r);
  if (f.type === 'quotidien') return 'every day';
  if (f.type === 'hebdo') return 'once a week';
  if (f.type === 'intervalle') return 'every ' + (f.intervalle || 2) + ' days';
  const j = (f.jours || []).slice().sort();
  return j.length ? j.map(n => DS[n % 7]).join(' ') : 'choose days';
}
const doneOn = (rid, iso) => S.occ.has(rid + '_' + iso);
function lastDoneBefore(rid, iso){ const arr = S.occBy.get(rid) || []; let last = null; for (const d of arr){ if (d < iso) last = d; else break; } return last; }
function showOnDay(r, iso){
  if (r.actif === false) return false;
  if (r.debut && iso < r.debut) return false;
  const f = freqOf(r);
  if (f.type === 'quotidien') return true;
  if (f.type === 'jours') return (f.jours || []).includes(wd(iso));
  if (doneOn(r.id, iso)) return true;
  if (f.type === 'hebdo'){ const mon = mondayOf(iso); const arr = S.occBy.get(r.id) || []; return !arr.some(d => d >= mon && d <= addDays(mon, 6)); }
  if (f.type === 'intervalle'){ const last = lastDoneBefore(r.id, iso); return !last || diffDays(last, iso) >= (f.intervalle || 2); }
  return false;
}
function nextDue(r){
  const f = freqOf(r);
  for (let i = 1; i <= 60; i++){
    const d = addDays(S.today, i);
    if (f.type === 'jours' && (f.jours || []).includes(wd(d))) return d;
    if (f.type === 'hebdo' && wd(d) === 1) return d;
    if (f.type === 'intervalle'){ const last = lastDoneBefore(r.id, addDays(S.today, 1)); if (last) return addDays(last, f.intervalle || 2); return d; }
  }
  return null;
}
const activeRoutines = () => Array.from(S.routines.values()).filter(r => r.actif !== false);
const routinesForDay = iso => activeRoutines().filter(r => showOnDay(r, iso)).sort((a, b) => (a.rubrique || '').localeCompare(b.rubrique || '') || String(a.creeLe || '').localeCompare(String(b.creeLe || '')));
function doneTodayCount(){
  let n = 0;
  for (const t of S.tasks.values()) if (t.statut === 'fait' && t.faitJour === S.today) n++;
  for (const o of S.occ.values()) if (o.date === S.today) n++;
  return n;
}

/* ---------------- Rendering helpers ---------------- */
function chk(act, id, on, label, extra, round){
  return `<button class="chk${on ? ' on' : ''}${round ? ' round' : ''}" data-act="${act}" data-id="${esc(id)}" ${extra || ''} aria-pressed="${on}" aria-label="${esc((on ? 'Untick: ' : 'Mark as done: ') + label)}"${S.readOnly ? ' disabled' : ''}><span class="box">${ICON.check}</span></button>`;
}
const suggTag = () => ` <span class="sugg">(suggested)</span>`;
function deadlineMeta(t){
  if (!t.echeance || t.statut === 'fait') return '';
  const n = diffDays(S.today, t.echeance), sg = (t.suggere || {}).echeance ? suggTag() : '';
  if (n < 0) return `<span class="chip warm">deadline was ${fmtRel(t.echeance)}</span>`;
  if (n <= 2) return `<span class="chip warm">deadline ${fmtRel(t.echeance)}</span>`;
  return `<span class="m">deadline ${fmtRel(t.echeance)}${sg}</span>`;
}
function taskRow(t, ctx){
  ctx = ctx || {};
  const done = t.statut === 'fait';
  const sg = t.suggere || {};
  const meta = [];
  if (ctx.showRub !== false) meta.push(rubChip(t.rubrique));
  if (t.sous) meta.push(`<span class="m">${esc(t.sous)}</span>`);
  if (t.type === 'achat'){ if (ctx.showAisle) meta.push(`<span class="m">${aisleOf(t)[1]} ${esc(aisleOf(t)[2])}</span>`); else if (!ctx.inShop) meta.push(`<span class="m">${ICON.basket}to buy</span>`); if (t.qte) meta.push(`<span class="m qty">${esc(t.qte)}</span>`); }
  if (t.type === 'rdv') meta.push(`<span class="m strong">${ICON.clock}${t.heure ? esc(t.heure) : 'appointment'}</span>`);
  if (!done){
    const dl = deadlineMeta(t); if (dl) meta.push(dl);
    if (t.prevue && ctx.showDate !== false){
      if (t.prevue < S.today) meta.push(`<span class="m">planned ${fmtRel(t.prevue)}</span>`);
      else if (t.prevue !== S.today) meta.push(`<span class="m">${fmtRel(t.prevue)}${sg.prevue ? suggTag() : ''}</span>`);
    }
    if (t.niveau === 'must' && ctx.showLevel !== false) meta.push(`<span class="chip acc">must happen</span>`);
    if (t.statut === 'en_cours') meta.push(`<span class="m">in progress</span>`);
    if (t.statut === 'en_attente') meta.push(`<span class="m">${ICON.hourglass}waiting${t.attendDe ? ' for ' + esc(t.attendDe) : ''}</span>`);
    if (t.statut === 'pause') meta.push(`<span class="m">paused</span>`);
    if (t.duree && ctx.showDur) meta.push(`<span class="m">~${fmtMin(t.duree)}</span>`);
    if (t.projetId && S.projets.has(t.projetId) && ctx.showProject !== false) meta.push(`<span class="m">${ICON.folder}${esc(S.projets.get(t.projetId).titre)}</span>`);
  } else if (ctx.showDoneDay && t.faitJour){
    meta.push(`<span class="m">done ${fmtRel(t.faitJour)}</span>`);
  }
  const later = ctx.later && !done && !S.readOnly && t.type !== 'rdv';
  const open = later && S.laterOpen === t.id;
  const next = !done && nextStepOf(t);
  return `<li class="row${done ? ' done' : ''}">
    ${chk('toggle-task', t.id, done, t.titre)}
    <button class="row-main" data-act="open-task" data-id="${esc(t.id)}">
      <span class="row-title">${esc(t.titre)}</span>
      ${next ? `<span class="row-next">→ ${esc(next)}</span>` : ''}
      ${meta.length ? `<span class="row-meta">${meta.join('')}</span>` : ''}
    </button>
    ${later ? `<button class="later" data-act="later" data-id="${esc(t.id)}" aria-expanded="${open}">Not now</button>` : '<span></span>'}
    ${open ? laterRow(t) : ''}
  </li>`;
}
function nextStepOf(t){
  if (Array.isArray(t.etapes)){ const s = t.etapes.find(x => x && !x.fait && x.t); if (s) return s.t; }
  return t.action || '';
}
function laterRow(t){
  const nf = nextFreeDay(t), mon = addDays(mondayOf(S.today), 7);
  const opts = [['tomorrow','Tomorrow'],['free','Calmer day: ' + fmtRel(nf)],['nextweek','Next week'],['nodate','Keep for another day'],['pause','Pause it']];
  const keep = t.echeance ? `<span class="small" style="flex-basis:100%">The deadline stays ${fmtRel(t.echeance)}.</span>` : '';
  return `<div class="later-row">${opts.filter(o => !(t.echeance && o[0] === 'nextweek' && mon > t.echeance)).map(o => `<button class="choice" data-act="later-go" data-id="${esc(t.id)}" data-v="${o[0]}">${esc(o[1])}</button>`).join('')}${keep}</div>`;
}
function routineRow(r, iso, ctx){
  ctx = ctx || {};
  const due = showOnDay(r, iso);
  const done = doneOn(r.id, iso);
  const meta = [];
  if (ctx.showRub) meta.push(rubChip(r.rubrique));
  if (r.sous) meta.push(`<span class="m">${esc(r.sous)}</span>`);
  meta.push(`<span class="m">${ICON.repeat}${esc(freqLabel(r))}</span>`);
  if (ctx.details){
    if (r.actif === false) meta.push(`<span class="m">paused</span>`);
    else if (!due){
      const f = freqOf(r);

    }
  }
  const box = (due && r.actif !== false) ? chk('toggle-routine', r.id, done, r.titre, `data-d="${iso}"`, true) : `<span class="chk round" aria-hidden="true"><span class="box" style="opacity:.35"></span></span>`;
  return `<li class="row${done ? ' done' : ''}">${box}
    <button class="row-main" data-act="open-routine" data-id="${esc(r.id)}"><span class="row-title">${esc(r.titre)}</span><span class="row-meta">${meta.join('')}</span></button><span></span></li>`;
}
function foldHead(key, title, count, def, minor){
  const open = isFold(key, def);

const visibleList = arr => S.prefs.showDone ? arr : arr.filter(t => t.statut !== 'fait');
const block = (title, arr, ctx, sub) => arr.length ? `<section class="sec"><h2 class="sec-h">${esc(title)} <span class="count">${arr.length}</span></h2>${sub ? `<p class="sec-sub">${sub}</p>` : ''}<ul class="list">${arr.map(t => taskRow(t, ctx || {})).join('')}</ul></section>` : '';
const linkRow = (act, attrs, icon, name, counts, style) => `<button class="rubrow" data-act="${act}" ${attrs || ''} style="${style || ''}"><span class="rubicon">${icon}</span><span style="min-width:0"><span class="rubname">${esc(name)}</span>${counts ? `<br><span class="rubcounts">${counts}</span>` : ''}</span><span class="chev">${ICON.chev}</span></button>`;

/* Notes waiting to be sorted or checked (the `saisies` collection). */
function notesBlock(){
  const sais = Array.from(S.saisies.values()).filter(x => !(S.busy && S.busy.saisieId === x.id)).sort((a, b) => String(a.creeLe || '').localeCompare(String(b.creeLe || '')));
  const ready = sais.filter(x => x.statut === 'propose');
  const wait = sais.filter(x => x.statut !== 'propose');
  let h = '';
  if (ready.length) h += `<section class="sec" style="order:0"><h2 class="sec-h">Ready to check <span class="count">${ready.length}</span></h2><div class="notes">${ready.map(x => noteCard(x, true)).join('')}</div></section>`;
  if (wait.length) h += `<section class="sec" style="order:0"><h2 class="sec-h">Saved, not sorted yet <span class="count">${wait.length}</span></h2><p class="sec-sub">Nothing is lost. Sort them when you like.</p><div class="notes">${wait.map(x => noteCard(x, false)).join('')}</div></section>`;
  return h;
}
function noteCard(x, ready){
  const full = String(x.texte || '');
  const ex = x.mode === 'ranger' ? 'Sort the Inbox' : clean(full, 160) + (full.length > 160 ? '…' : '');
  const t = x.creeLe ? new Date(x.creeLe) : null;
  const when = t && !isNaN(t) ? `${cap1(fmtRel(isoOf(t)))} at ${pad(t.getHours())}:${pad(t.getMinutes())}` : '';
  const p = x.proposition || {};
  const els = ready && Array.isArray(p.elements) ? p.elements.length : 0;
  const qs = ready && Array.isArray(p.questions) ? p.questions.length : 0;
  const info = ready ? ' · ' + [els ? els + ' suggestion' + (els > 1 ? 's' : '') : '', qs ? qs + ' question' + (qs > 1 ? 's' : '') : ''].filter(Boolean).join(', ') : '';
  const confirm = S.confirm === 'saisie:' + x.id;
  return `<div class="note${ready ? '' : ' wait'}"><p class="note-text">“${esc(ex)}”</p><p class="small" style="margin:0">${esc(when)}${esc(info)}</p>
    ${S.readOnly ? '' : `<div class="acts">${ready ? `<button class="btn primary small" data-act="saisie-open" data-id="${esc(x.id)}">Check</button>` : `<button class="btn primary small" data-act="saisie-retry" data-id="${esc(x.id)}">Sort now</button>${x.mode === 'ranger' ? '' : `<button class="btn ghost small" data-act="saisie-asis" data-id="${esc(x.id)}">Add as it is</button>`}`}
    <button class="linkbtn danger" data-act="saisie-del" data-id="${esc(x.id)}">${confirm ? 'Yes, delete it' : 'Delete'}</button></div>`}</div>`;
}

/* ---------------- Today ---------------- */
function renderToday(){
  if (S.dbState === 'loading' || (S.dbState === 'ok' && !(S.loaded.taches && S.loaded.routines))) return `<p class="small" style="margin-top:24px">Loading your space…</p>`;
  const M = todayModel(), td = S.today;
  let h = '';
  const notes = notesBlock();
  if (!S.tasks.size && !S.routines.size){
    return notes + `<div class="welcome"><h2>Welcome to your space</h2>
      <p>Write or dictate whatever is on your mind, even all mixed up. The assistant suggests where each thing belongs and you confirm. It only adds a date when you give one.</p>
      <p>Routines (tidying, Joud’s bag…) live in <strong>Plans</strong>, inside each area.</p>
      <div><button class="btn ghost" data-act="example">Show me an example</button></div></div>
      <section class="sec">${captureBox('today', 'Quick add', 'Anything on your mind: tasks, shopping, plans, things already done…')}</section>`;
  }

  // Up next
  let up = `<section class="upnext" style="order:1" aria-labelledby="upnextH"><p class="eyebrow-s" id="upnextH">${M.calm ? 'Just this, for now' : 'Up next'}</p>`;
  if (M.upnext){
    const t = M.upnext, step = nextStepOf(t);
    const meta = [rubChip(t.rubrique), deadlineMeta(t), t.duree ? `<span class="m">~${fmtMin(t.duree)}</span>` : '', t.niveau === 'must' ? `<span class="chip acc">must happen</span>` : ''].filter(Boolean);
    up += `<div class="un-row">${chk('toggle-task', t.id, false, t.titre)}<button class="un-title" data-act="open-task" data-id="${esc(t.id)}">${esc(t.titre)}</button></div>
      <div class="row-meta">${meta.join('')}</div>
      ${step ? `<p class="un-step"><strong>First step:</strong> ${esc(step)}</p>` : (M.calm && durOf(t) > 10 ? `<p class="un-step">Start with five minutes. You can stop after that.</p>` : '')}
      ${S.readOnly ? '' : `<div class="acts"><button class="btn ghost small" data-act="why" data-id="${esc(t.id)}">Why this?</button><button class="btn ghost small" data-act="later" data-id="${esc(t.id)}" aria-expanded="${S.laterOpen === t.id}">Not now</button>${(!Array.isArray(t.etapes) || !t.etapes.length) && durOf(t) >= 30 ? `<button class="btn ghost small" data-act="steps" data-id="${esc(t.id)}">Break into steps</button>` : ''}</div>`}
      ${S.laterOpen === t.id ? `<div style="display:grid">${laterRow(t)}</div>` : ''}`;
  } else {
    up += `<p style="margin:0;font-size:1.1rem;font-weight:600">Nothing pressing right now.</p><p class="quiet">You can look at <button class="linkbtn" data-act="go" data-view="week">your week</button> or simply leave the day as it is.</p>`;
  }
  if (M.enough && !LS.get('ms.enough.' + td, false)) up += `<div class="enough"><span>That’s enough for today. Anything else is a bonus.</span><button class="linkbtn" data-act="enough-ok">OK</button></div>`;
  up += `</section>`;

  // Don't miss
  const dm = [];
  M.rdvToday.forEach(t => dm.push(taskRow(t, { later:false })));
  M.deadlines.forEach(t => dm.push(taskRow(t, { later:true })));
  M.mustBuy.forEach(t => dm.push(taskRow(t, { later:false })));
  let dmH = `<section class="sec" style="order:2"><h2 class="sec-h">Don’t miss</h2>`;
  dmH += dm.length ? `<ul class="list">${dm.join('')}</ul>` : `<p class="quiet">No appointments or deadlines in the next three days.</p>`;
  if (M.rdvTomorrow.length) dmH += `<p class="small" style="margin:10px 0 0">Tomorrow: ${M.rdvTomorrow.map(t => esc(t.titre) + (t.heure ? ' at ' + esc(t.heure) : '')).join(' · ')}</p>`;
  dmH += `</section>`;

  if (M.calm){
    h += `<div class="calmhead" style="order:0"><span>One thing at a time. The rest is still saved in Plans.</span><button class="btn ghost small" data-act="calm" data-v="0">Back to full view</button></div>`;
    h += up + dmH;
    const flex = M.cands.filter(t => !isFirm(t) && (!M.upnext || t.id !== M.upnext.id));
    if (flex.length && !S.readOnly) h += `<section class="sec" style="order:3"><div class="card soft"><span>${flex.length} flexible thing${flex.length > 1 ? 's are' : ' is'} also on today. They can move to another day.</span><div><button class="btn primary small" data-act="lighten" data-all="1">Move flexible things to later</button></div></div></section>`;
    return notes + `<div class="today-grid">${h}</div>`;
  }

  // Also on your list
  const alsoAll = visibleList(M.also.concat(M.doneToday.filter(t => !M.also.includes(t) && (!M.upnext || t.id !== M.upnext.id) && !M.deadlines.includes(t) && !M.rdvToday.includes(t))));
  const firstOpen = alsoAll.filter(t => t.statut !== 'fait').slice(0, 3);
  const rest = alsoAll.filter(t => !firstOpen.includes(t));
  let also = '';
  if (alsoAll.length){
    also = `<section class="sec" style="order:3"><h2 class="sec-h">Also on your list</h2>${firstOpen.length ? `<ul class="list">${firstOpen.map(t => taskRow(t, { later:true })).join('')}</ul>` : ''}`;
    if (rest.length){ const open = isFold('today-rest', false); also += `<div style="margin-top:8px">${foldHead('today-rest', 'The rest of today', rest.length, false, true)}</div>${open ? `<ul class="list">${rest.map(t => taskRow(t, { later:true })).join('')}</ul>` : ''}`; }
    also += `</section>`;
  }

  // Gentle nudge for a protected area that has been quiet (one at most, never when the day is full)
  let nudge = '';
  if (!M.overloaded && !S.readOnly){
    const nd = S.settings && S.settings.nudges || {};
    const area = protectedAreas().find(k => rubById(k) && quietDays(k) >= 5 && !(nd[k] && nd[k] >= td) && !M.cands.some(t => t.rubrique === k));
    if (area){
      const lbl = rubLabel(area);
      nudge = `<section class="sec" style="order:4"><div class="card"><span>You haven’t had much time for ${esc(lbl)} lately. Would you like to find a small opening this week?</span>
        <div class="acts"><button class="btn primary small" data-act="nudge-yes" data-k="${area}">Yes</button><button class="btn ghost small" data-act="nudge-later" data-k="${area}">Later</button><button class="btn ghost small" data-act="nudge-no" data-k="${area}">Not a priority right now</button></div></div></section>`;
    }
  }

  // One tip a day, only when nothing else is asking for attention
  let tip = '';
  if (!nudge && !M.overloaded && !S.readOnly){ const tp = tipOfDay(); if (tp) tip = `<section class="sec" style="order:4">${tipCard(tp)}</section>`; }

  // Routines
  let rt = '';
  if (M.routs.length){
    const rDone = M.routs.filter(r => doneOn(r.id, td)).length;
    const open = isFold('today-routines', true);
    rt = `<section class="sec" style="order:5">${foldHead('today-routines', 'Routines', rDone + NB + 'of' + NB + M.routs.length, true)}
      <div class="prog" aria-hidden="true"><i style="width:${Math.round(100 * rDone / M.routs.length)}%"></i></div>
      ${open ? `<ul class="list">${M.routs.filter(r => S.prefs.showDone || !doneOn(r.id, td)).map(r => routineRow(r, td, { showRub:true })).join('')}</ul>` : ''}</section>`;
  }

  // Shopping shortcut
  const toBuy = allTasks().filter(t => t.type === 'achat' && isOpenAct(t)).length;
  const shop = `<section class="sec" style="order:6">${linkRow('go', 'data-view="shopping"', ICON.basket, 'Shopping', toBuy ? toBuy + ' to buy' : 'Nothing to buy', '--c:var(--accent);--cs:var(--accent-soft)')}</section>`;

  // How's today (optional) + gentle overload note
  const ds = dayState();
  let state = `<section class="sec" style="order:8"><div class="card soft"><strong>How’s today?</strong><span class="small">Optional. It helps keep the day realistic.</span>
    <div class="dayrow"><span class="lbl">Time</span><span class="chips">${[['little','A little'],['some','Some'],['plenty','Plenty']].map(x => `<button class="choice" data-act="day" data-k="temps" data-v="${x[0]}" aria-pressed="${ds.temps === x[0]}"${S.readOnly ? ' disabled' : ''}>${x[1]}</button>`).join('')}</span></div>
    <div class="dayrow"><span class="lbl">Energy</span><span class="chips">${[['low','Low'],['ok','OK'],['good','Good']].map(x => `<button class="choice" data-act="day" data-k="energie" data-v="${x[0]}" aria-pressed="${ds.energie === x[0]}"${S.readOnly ? ' disabled' : ''}>${x[1]}</button>`).join('')}</span></div>`;
  if (M.overloaded && !S.readOnly){
    state += `<p style="margin:6px 0 0">Today holds about ${fmtMin(M.openLoad)} of things${M.avail ? ` for roughly ${fmtMin(M.avail)} of time` : ''}. That’s a lot for one day.</p><div><button class="btn primary small" data-act="lighten">Lighten today</button></div>`;
  }
  state += `</div></section>`;
  if (M.overloaded && !S.readOnly) state = state.replace('style="order:8"', 'style="order:2"');

  const qa = `<section class="sec" style="order:7">${captureBox('today', 'Quick add', 'Anything on your mind: tasks, shopping, plans, things already done…')}</section>`;
  const calmBtn = S.readOnly ? '' : `<div style="order:0;margin-top:4px"><button class="calmlink" data-act="calm" data-v="1">Too much right now?</button></div>`;
  return notes + `<div class="today-grid"><div class="col">${calmBtn}${up}${also}${nudge}${tip}${qa}</div><div class="col">${dmH}${state}${rt}${shop}</div></div>`;
}

/* ---------------- Shopping ---------------- */
function renderShopping(){
  const items = allTasks().filter(t => t.type === 'achat');
  const open = items.filter(t => isOpenAct(t) || t.statut === 'en_attente');
  const bought = items.filter(t => t.statut === 'fait').sort((a, b) => String(b.faitLe || '').localeCompare(String(a.faitLe || '')));
  const recent = bought.filter(t => t.faitJour && t.faitJour > addDays(S.today, -7));
  const usual = bought.filter(t => t.recurrent);
  const store = S.store;
  let h = `<div class="seg" role="tablist" aria-label="Shopping view"><button role="tab" data-act="store" data-v="0" aria-selected="${!store}">My list</button><button role="tab" data-act="store" data-v="1" aria-selected="${store}">At the store</button></div>`;
  if (!store && !S.readOnly){
    const area = S.shopArea || 'maison';
    h += `<div class="addline"><label class="cap-label" for="shopAdd" style="font-size:1rem">Add to the list</label>
      <div class="inline"><input class="field" id="shopAdd" data-draft="shop" value="${esc(LS.get('ms.draft.shop', ''))}" placeholder="milk, nappies, 2 notebooks…" autocomplete="off"><button class="btn primary" data-act="shop-add">Add</button></div>
      <div class="chips" role="group" aria-label="For">${visibleRubs().filter(r => r.key !== 'inbox').map(r => `<button class="choice" data-act="shop-area" data-v="${esc(r.key)}" aria-pressed="${area === r.key}" style="${rubStyle(r.key)}"><i class="dot"></i>${esc(r.label)}</button>`).join('')}</div></div>`;
  }
  if (!open.length) h += `<div class="empty" style="margin-top:16px">Nothing to buy. Items you add here, or through Quick add, appear in one list.</div>`;
  else {
    if (!store) h += `<div class="filters" role="group" aria-label="Group by">${[['aisle','By aisle'],['area','By area'],['store','By shop']].map(x => `<button class="choice" data-act="shop-group" data-v="${x[0]}" aria-pressed="${S.shopGroup === x[0]}">${x[1]}</button>`).join('')}</div>`;
    const groups = new Map();
    const g = store ? 'aisle' : S.shopGroup;
    const keyOf = t => g === 'store' ? (t.magasin || 'Anywhere') : g === 'area' ? rubLabel(t.rubrique) : aisleOf(t)[0];
    const rank = t => g === 'aisle' ? String(AISLES.indexOf(aisleOf(t))).padStart(2, '0') : keyOf(t);
    open.slice().sort((a, b) => rank(a).localeCompare(rank(b)) || String(a.creeLe || '').localeCompare(String(b.creeLe || ''))).forEach(t => { const k = keyOf(t); if (!groups.has(k)) groups.set(k, []); groups.get(k).push(t); });
    h += `<div class="${store ? 'store' : ''}">`;
    groups.forEach((arr, k) => {
      const a = g === 'aisle' ? AISLES.find(x => x[0] === k) : null;
      const title = a ? `<span class="aisle" aria-hidden="true">${a[1]}</span>${esc(a[2])}` : esc(k);
      h += `<section class="sec" style="margin-top:18px"><h2 class="sec-h">${title} <span class="count">${arr.length}</span></h2><ul class="list">${arr.map(t => taskRow(t, { showRub:!store && g !== 'area', showLevel:false, inShop:true })).join('')}</ul></section>`;
    });
    h += `</div>`;
  }
  if (recent.length){
    const o = isFold('shop-bought', !store);
    h += `<section class="sec">${foldHead('shop-bought', 'Bought this week', recent.length, !store)}${o ? `<ul class="list">${recent.map(t => taskRow(t, { showDoneDay:true, showLevel:false, inShop:true })).join('')}</ul>` : ''}</section>`;
  }
  const usualAvail = usual.filter(t => !recent.includes(t) || true);
  if (usualAvail.length && !S.readOnly){
    const o = isFold('shop-usual', false);
    h += `<section class="sec">${foldHead('shop-usual', 'Usual items: check before buying', usualAvail.length, false)}${o ? `<p class="sec-sub">I don’t know what’s at home. Tap the ones you need.</p><div class="choices">${usualAvail.map(t => `<button class="choice" data-act="need" data-id="${esc(t.id)}">${ICON.plus.replace('<svg', '<svg style="width:18px;height:18px"')}${esc(t.titre)}</button>`).join('')}</div>` : ''}</section>`;
  }
  const old = bought.filter(t => !t.recurrent && t.faitJour && t.faitJour <= addDays(S.today, -7));
  if (old.length && !S.readOnly && !store){
    h += `<div class="morelinks">${S.confirm === 'clear-bought' ? `<div class="confirm"><span>Remove ${old.length} item${old.length > 1 ? 's' : ''} bought more than a week ago? Usual items are kept.</span><button class="btn small" style="background:var(--warm);color:var(--surface)" data-act="clear-bought">Remove</button><button class="btn ghost small" data-act="confirm" data-v="">Keep</button></div>` : `<button class="linkbtn" data-act="confirm" data-v="clear-bought">Tidy up older bought items (${old.length})</button>`}</div>`;
  }
  return h;
}

/* ---------------- Plans ---------------- */
function renderPlans(){
  const tasks = allTasks();
  const wk0 = mondayOf(S.today), wk1 = addDays(wk0, 6);
  const wkN = tasks.filter(t => isOpen(t) && t.type !== 'achat' && dateOf(t) && dateOf(t) >= S.today && dateOf(t) <= wk1).length;
  const rdvN = tasks.filter(t => t.type === 'rdv' && isOpen(t) && dateOf(t) && dateOf(t) >= S.today && dateOf(t) <= wk1).length;
  let h = `<section><div class="inline" style="justify-content:space-between;margin-bottom:8px"><h2 class="sec-h" style="margin:0">This week</h2><button class="linkbtn" data-act="go" data-view="week">See the week</button></div><div class="wstrip">`;
  for (let i = 0; i < 7; i++){
    const d = addDays(wk0, i), has = tasks.some(t => t.type !== 'achat' && isOpen(t) && dateOf(t) === d);
    h += `<button class="wday${d === S.today ? ' now' : ''}${has ? ' has' : ''}" data-act="go-day" data-d="${d}" aria-label="${esc(fmtLong(d))}${has ? ', something planned' : ''}">${DS[parseISO(d).getDay()]}<b>${parseISO(d).getDate()}</b><i></i></button>`;
  }
  h += `</div><p class="small" style="margin:8px 0 0">${[wkN ? wkN + ' planned' : 'Nothing planned yet', rdvN ? rdvN + ' appointment' + (rdvN > 1 ? 's' : '') : ''].filter(Boolean).join(' · ')}</p></section>`;
  h += `<section class="sec"><h2 class="sec-h">Life areas</h2><div class="tiles">`;
  for (const r of visibleRubs()){
    const open = tasks.filter(t => t.rubrique === r.key && isOpen(t) && t.statut !== 'en_attente' && t.type !== 'achat');
    const week = open.filter(t => dateOf(t) && dateOf(t) <= addDays(S.today, 6)).length;
    const rts = activeRoutines().filter(x => x.rubrique === r.key);
    const parts = [open.length ? open.length + ' to do' : 'nothing to do'];
    if (week) parts.push(week + ' this week');
    if (rts.length) parts.push(rts.length + ' routine' + (rts.length > 1 ? 's' : ''));
    h += `<button class="tile" data-act="go-area" data-rub="${esc(r.key)}" style="${rubStyle(r.key)}"><span class="rubicon">${rubIcon(r.key)}</span><span class="rubname">${esc(r.label)}</span><span class="rubcounts">${esc(parts.join(' · '))}</span></button>`;
  }
  h += `</div></section>`;
  const projA = Array.from(S.projets.values()).filter(p => p.statut !== 'fait' && p.statut !== 'pause').length;
  const keepN = Array.from(S.idees.values()).filter(x => x.statut === 'open' || x.statut === 'note').length;
  const waitN = tasks.filter(t => t.statut === 'en_attente').length;
  const pauseN = tasks.filter(t => t.statut === 'pause').length + Array.from(S.projets.values()).filter(p => p.statut === 'pause').length + Array.from(S.routines.values()).filter(r => r.actif === false).length;
  const easyN = Array.from(S.frictions.values()).filter(f => f.statut !== 'solved' && f.statut !== 'dismissed').length;
  h += `<section class="sec"><h2 class="sec-h">Bigger picture</h2><div class="rublist">
    ${linkRow('go', 'data-view="projects"', ICON.folder, 'Projects', projA ? projA + ' active' : 'goals with several steps')}
    ${linkRow('go', 'data-view="keep"', ICON.bulb, 'Keep in mind', keepN ? keepN + ' thought' + (keepN > 1 ? 's' : '') : 'ideas and decisions that aren’t tasks yet')}
    ${linkRow('go', 'data-view="waiting"', ICON.hourglass, 'Waiting for', waitN ? waitN + ' item' + (waitN > 1 ? 's' : '') : 'answers and replies from others')}
    ${linkRow('go', 'data-view="paused"', ICON.pause, 'Paused', pauseN ? pauseN + ' on hold' : 'nothing on hold')}
    ${linkRow('go', 'data-view="tips"', ICON.bulb, 'Tips', 'small practical ideas, when you want them')}
    ${linkRow('go', 'data-view="easier"', ICON.wand, 'Make life easier', easyN ? easyN + ' to look at' : 'small changes for problems that keep coming back')}
  </div></section>`;
  return h;
}

function renderWeek(){
  const start = addDays(mondayOf(S.today), 7 * S.weekOffset);
  const tasks = allTasks().filter(t => t.statut !== 'pause' && t.type !== 'achat');
  let h = `<div class="weeknav"><button class="iconbtn" data-act="week" data-d="-1" aria-label="Previous week">${ICON.left}</button>
    <strong>${fmtShort(start)} – ${fmtShort(addDays(start, 6))}</strong>
    <button class="iconbtn" data-act="week" data-d="1" aria-label="Next week">${ICON.right}</button></div>`;
  if (S.weekOffset !== 0) h += `<div style="text-align:center"><button class="linkbtn" data-act="week" data-d="0">Back to this week</button></div>`;
  h += `<div class="twocol">`;
  for (let i = 0; i < 7; i++){
    const d = addDays(start, i);
    const items = tasks.filter(t => t.statut === 'fait' ? (t.faitJour === d) : (dateOf(t) === d));
    const rdv = items.filter(t => t.type === 'rdv' && t.statut !== 'fait').sort(byHeure);
    const open = items.filter(t => t.type !== 'rdv' && t.statut !== 'fait').sort(byScore);
    const done = items.filter(t => t.statut === 'fait');
    const load = rdv.concat(open).reduce((n, t) => n + durOf(t), 0);
    const nRout = d >= S.today ? activeRoutines().filter(r => { const f = freqOf(r); return f.type === 'quotidien' || (f.type === 'jours' && (f.jours || []).includes(wd(d))); }).length : 0;
    const list = rdv.concat(open, S.prefs.showDone ? done : []);
    const cls = d === S.today ? ' today' : (d < S.today ? ' past' : '');
    h += `<section class="day${cls}" id="day-${d}"><div class="day-h"><strong>${fmtLong(d)}</strong>${d === S.today ? '<span class="chip acc">today</span>' : ''}${d >= S.today && load ? `<span class="small">about ${fmtMin(load)}</span>` : ''}${d >= S.today && load > 240 ? '<span class="chip warm">full day</span>' : ''}
      ${!S.readOnly ? `<button class="btn ghost small addday" data-act="new-task" data-prevue="${d}" aria-label="Add on ${fmtLong(d)}">${ICON.plus}<span>Add</span></button>` : ''}</div>
      ${list.length ? `<ul class="list">${list.map(t => taskRow(t, { showDate:false, later:d >= S.today })).join('')}</ul>` : `<div class="day-empty">${d < S.today ? 'Nothing noted.' : 'Nothing planned.'}</div>`}
      ${nRout ? `<div class="day-empty">${ICON.repeat.replace('<svg', '<svg style="width:16px;height:16px;vertical-align:-3px"')} ${nRout} routine${nRout > 1 ? 's' : ''}</div>` : ''}
    </section>`;
  }
  h += `</div><p class="small" style="margin-top:18px">Times are rough estimates. Things without a date stay in their area in Plans.</p>`;
  return h;
}

function renderArea(){
  const k = S.rub, r = rubById(k);
  if (!r){ S.view = 'plans'; return renderPlans(); }
  let h = `<div class="seg" role="tablist" aria-label="Area view">${[['todo','To do'],['routines','Routines'],['done','Done']].map(x => `<button role="tab" data-act="rubtab" data-tab="${x[0]}" aria-selected="${S.rubTab === x[0]}">${x[1]}</button>`).join('')}</div>`;
  const tasks = allTasks().filter(t => t.rubrique === k);
  if (S.rubTab === 'todo'){
    if (!S.readOnly) h += captureBox('area', 'Add to ' + r.label, 'One or several things, in any order.');
    const sousSet = Array.from(new Set(tasks.filter(t => t.sous && t.statut !== 'fait' && t.type !== 'achat').map(t => t.sous))).sort();
    if (sousSet.length >= 2) h += `<div class="filters" role="group" aria-label="Filter">${[null].concat(sousSet).map(s => `<button class="choice" data-act="sous" data-v="${esc(s || '')}" aria-pressed="${(S.sousFilter || null) === s}">${esc(s || 'All')}</button>`).join('')}</div>`;
    const f = S.sousFilter ? tasks.filter(t => t.sous === S.sousFilter) : tasks;
    const lim = addDays(S.today, 6);
    const act = f.filter(t => isOpenAct(t) && t.type !== 'achat');
    const nextT = act.filter(t => t.type !== 'rdv').sort(byScore)[0];
    const week = act.filter(t => dateOf(t) && dateOf(t) <= lim && t !== nextT).sort((a, b) => dateOf(a).localeCompare(dateOf(b)) || byHeure(a, b));
    const later = act.filter(t => dateOf(t) && dateOf(t) > lim && t !== nextT).sort((a, b) => dateOf(a).localeCompare(dateOf(b)));
    const nodate = act.filter(t => !dateOf(t) && t !== nextT).sort(byScore);
    const buy = f.filter(t => t.type === 'achat' && isOpenAct(t));
    const wait = f.filter(t => t.statut === 'en_attente');
    const pause = f.filter(t => t.statut === 'pause');
    const done = f.filter(t => t.statut === 'fait' && t.faitJour && t.faitJour > addDays(S.today, -7)).sort((a, b) => String(b.faitLe || '').localeCompare(String(a.faitLe || '')));
    const projs = Array.from(S.projets.values()).filter(p => p.rubrique === k && p.statut !== 'fait');
    let body = '';
    if (nextT) body += `<section class="sec"><h2 class="sec-h">Next small step</h2><ul class="list">${taskRow(nextT, { showRub:false, later:true, showDur:true })}</ul></section>`;

    body += block('Later', later, { showRub:false, later:true });
    body += block('No date yet', nodate, { showRub:false, later:true }, nodate.length > 5 ? 'No need to do these now. They are kept here so you don’t have to remember them.' : '');
    if (projs.length) body += `<section class="sec"><h2 class="sec-h">Projects <span class="count">${projs.length}</span></h2><div class="rublist">${projs.map(p => linkRow('go-project', `data-id="${esc(p.id)}"`, ICON.folder, p.titre, projectCounts(p), rubStyle(k))).join('')}</div></section>`;
    body += block('To buy', buy, { showRub:false });
    body += block('Waiting for', wait, { showRub:false });
    if (pause.length){ const o = isFold('area-pause', false); body += `<section class="sec">${foldHead('area-pause', 'Paused', pause.length, false)}${o ? `<ul class="list">${pause.map(t => taskRow(t, { showRub:false })).join('')}</ul>` : ''}</section>`; }
    if (S.prefs.showDone && done.length) body += `<section class="sec"><h2 class="sec-h">Done this week <span class="count">${done.length}</span></h2><ul class="list">${done.slice(0, 12).map(t => taskRow(t, { showRub:false, showDoneDay:true })).join('')}</ul></section>`;
    if (!body) body = `<div class="empty" style="margin-top:22px">Nothing in ${esc(r.label)} yet. Write above whatever comes to mind and it will be sorted here.</div>`;
    h += body;

  } else if (S.rubTab === 'routines'){
    const rts = Array.from(S.routines.values()).filter(x => x.rubrique === k);
    const today = rts.filter(x => x.actif !== false && showOnDay(x, S.today));
    const others = rts.filter(x => !today.includes(x));
    if (today.length) h += `<section class="sec"><h2 class="sec-h">Today</h2><ul class="list">${today.map(x => routineRow(x, S.today, { details:true })).join('')}</ul></section>`;
    if (others.length) h += `<section class="sec"><h2 class="sec-h">Other days</h2><ul class="list">${others.map(x => routineRow(x, S.today, { details:true })).join('')}</ul></section>`;
    if (!rts.length) h += `<div class="empty" style="margin-top:14px">A routine comes back on its own: every day, on some days, or once a week. What you tick is kept, and the next day starts fresh without erasing anything.</div>`;
    if (!S.readOnly){
      h += `<div class="morelinks"><button class="btn primary" data-act="new-routine">${ICON.plus}New routine</button></div>`;
      const ideas = (ROUTINE_IDEAS[k] || []).filter(i => !rts.some(x => x.titre.toLowerCase() === i[0].toLowerCase()));
      if (ideas.length){
        const o = isFold('ideas-' + k, rts.length < 3);
        h += `<section class="sec">${foldHead('ideas-' + k, 'Routine ideas', null, rts.length < 3)}${o ? `<p class="sec-sub">Only if useful. You can adjust the rhythm before saving.</p><div class="choices">${ideas.map((i, n) => `<button class="choice" data-act="routine-idea" data-i="${n}">${ICON.plus.replace('<svg', '<svg style="width:18px;height:18px"')}${esc(i[0])}</button>`).join('')}</div>` : ''}</section>`;
      }
    }
  } else h += doneList({ rub:k, period:30, compact:true });
  return h;
}

/* ---------------- Done ---------------- */
function doneItems(rub, from){
  const items = [];
  for (const t of S.tasks.values()) if (t.statut === 'fait' && t.faitJour && t.faitJour >= from && (rub === 'all' || t.rubrique === rub)) items.push({ kind:'t', day:t.faitJour, titre:t.titre, rubrique:t.rubrique, id:t.id, ts:t.faitLe || '', achat:t.type === 'achat' });
  for (const o of S.occ.values()){
    const r = S.routines.get(o.routineId);
    const rb = r ? r.rubrique : o.rubrique;
    if (o.date >= from && (rub === 'all' || rb === rub)) items.push({ kind:'r', day:o.date, titre:r ? r.titre : (o.titre || 'Routine'), rubrique:rb, id:o.id, ts:o.faitLe || '' });
  }
  return items.sort((a, b) => b.day.localeCompare(a.day) || String(b.ts).localeCompare(String(a.ts)));
}
function doneList(o){
  const from = o.period ? addDays(S.today, -(o.period - 1)) : '0000-00-00';
  const items = doneItems(o.rub, from);
  if (!items.length) return `<div class="empty" style="margin-top:14px">Nothing yet for this period. Everything you tick lands here.</div>`;
  let h = '', cur = null;
  for (const it of items){
    if (it.day !== cur){
      if (cur) h += `</ul>`;
      cur = it.day;
      h += `<h3 class="dayhead">${cap1(fmtRel(cur))} <span class="small">· ${items.filter(x => x.day === cur).length}</span></h3><ul class="list">`;
    }
    const meta = (o.compact ? '' : rubChip(it.rubrique)) + (it.kind === 'r' ? `<span class="m">${ICON.repeat}routine</span>` : '') + (it.achat ? `<span class="m">${ICON.basket}bought</span>` : '');
    const content = `<span class="donebadge">${ICON.check}</span><span class="fr-text"><span class="row-title">${esc(it.titre)}</span>${meta ? `<span class="row-meta">${meta}</span>` : ''}</span>`;
    h += it.kind === 't' ? `<li class="row fr"><button class="fr-btn" data-act="open-task" data-id="${esc(it.id)}">${content}</button></li>` : `<li class="row fr">${content}</li>`;
  }
  return h + `</ul>`;
}
function renderDone(){
  const rub = S.doneRub;
  const week = doneItems(rub, mondayOf(S.today));
  const wR = week.filter(x => x.kind === 'r').length;
  let h = `<p class="sub" style="margin-top:4px">This week: ${week.length} thing${week.length === 1 ? '' : 's'} done${wR ? `, including ${wR} routine${wR > 1 ? 's' : ''}` : ''}. Small things count too.</p>`;
  const o = isFold('done-bars', false);
  h += `<div style="margin-top:8px">${foldHead('done-bars', 'Last seven days', null, false, true)}</div>`;
  if (o){
    const start7 = addDays(S.today, -6), counts = []; let max = 1;
    for (let i = 0; i < 7; i++){ const d = addDays(start7, i); const n = doneItems(rub, d).filter(x => x.day === d).length; counts.push([d, n]); if (n > max) max = n; }
    h += `<div class="bars" role="img" aria-label="Done in the last seven days: ${counts.map(c => fmtRel(c[0]) + ' ' + c[1]).join(', ')}">${counts.map(c => `<div class="bar${c[0] === S.today ? ' today' : ''}"><span>${c[1]}</span><span class="track"><span class="fill" style="height:${c[1] ? Math.max(8, Math.round(100 * c[1] / max)) : 4}%"></span></span><span>${DS[parseISO(c[0]).getDay()]}</span></div>`).join('')}</div>`;
  }
  h += `<div class="filters" role="group" aria-label="Period">${[[7,'7 days'],[30,'30 days'],[0,'All']].map(p => `<button class="choice" data-act="done-period" data-v="${p[0]}" aria-pressed="${S.doneFilter === p[0]}">${p[1]}</button>`).join('')}</div>`;
  h += `<div class="filters" role="group" aria-label="Area" style="margin-top:4px">${[['all','All areas']].concat(rubriques().map(r => [r.key, r.label])).map(p => `<button class="choice" data-act="done-rub" data-v="${esc(p[0])}" aria-pressed="${S.doneRub === p[0]}" style="${p[0] === 'all' ? '' : rubStyle(p[0])}">${p[0] === 'all' ? '' : '<i class="dot"></i>'}${esc(p[1])}</button>`).join('')}</div>`;
  h += doneList({ rub, period:S.doneFilter });
  if (S.doneFilter === 0) h += `<p class="small" style="margin-top:14px">Ticked routines are shown for the last four months.</p>`;
  return h;
}

let raf = 0, pendingRender = false;
function render(){ if (raf) return; raf = requestAnimationFrame(() => { raf = 0; doRender(); }); }
function typing(){ const a = document.activeElement; return a && $('#main').contains(a) && (a.tagName === 'TEXTAREA' || (a.tagName === 'INPUT' && a.type !== 'checkbox')); }
function doRender(force){
  /* While she types or dictates in a field on the page, live updates wait until she leaves it,
     so a sync never interrupts dictation. */
  if (!force && typing()){ pendingRender = true; renderChrome(); return; }
  pendingRender = false;
  renderChrome();
  const v = VIEWS[S.view] || VIEWS.today;
  $('#main').innerHTML = v.render();
}
function renderChrome(){
  const v = VIEWS[S.view] || VIEWS.today;
  if (S.view === 'today'){ const g = greeting(); $('#viewTitle').innerHTML = `<span class="sun">${g.icon}</span><span>${esc(g.text)}</span>`; }
  else $('#viewTitle').textContent = v.title();
  const sub = v.sub ? v.sub() : '';
  $('#viewSub').textContent = sub; $('#viewSub').hidden = !sub;
  const back = v.back;
  $('#backBtn').hidden = !back;
  if (back) $('#backLabel').textContent = VIEWS[back].title();
  const eb = v.eyebrow ? v.eyebrow() : '';
  $('#viewEyebrow').textContent = back ? '' : eb;
  $('#viewEyebrow').hidden = !!back || !eb;
  const nd = doneTodayCount();
  const dc = $('#doneChip');
  dc.hidden = S.view === 'done' || nd === 0;
  dc.innerHTML = `${ICON.check}${nd} today`;

/* ---------------- Writes ---------------- */
const queues = {};
function q(key, fn){ const p = (queues[key] || Promise.resolve()).catch(() => {}).then(fn); queues[key] = p; return p; }
async function write(key, fn, okMsg){
  if (!S.db){ toast('Your data isn’t available here.'); return false; }
  if (S.readOnly){ toast('This account can’t change this space.'); return false; }
  try { await q(key, fn); if (okMsg) toast(okMsg); return true; }
  catch(e){
    const code = e && e.code;
    if (code === 'unavailable'){
      try { await new Promise(r => setTimeout(r, 600 + Math.random() * 900)); await q(key, fn); if (okMsg) toast(okMsg); return true; } catch(e2){ toast('No connection right now. Try again in a moment.'); return false; }
    }
    if (code === 'invalid_argument'){ S.readOnly = true; render(); toast('This account can’t change this space.'); return false; }
    if (code === 'quota_exceeded'){ toast('Your space is full. Tidy up old items to continue.'); return false; }
    if (code === 'revoked'){ S.revoked = true; S.readOnly = true; render(); return false; }
    if (code === 'resource_exhausted'){ toast('Too many changes at once. Wait a few seconds.'); return false; }
    toast('That didn’t save. Please try again.');
    return false;
  }
}

function toggleTask(id){
  const t = S.tasks.get(id); if (!t) return;
  const done = t.statut === 'fait', now = nowIso();
  const patch = done ? { statut:'a_faire', faitLe:null, faitJour:null, modifieLe:now } : { statut:'fait', faitLe:now, faitJour:S.today, modifieLe:now };
  if (!done && t.type === 'achat') patch.fois = (t.fois || 0) + 1;
  if (S.laterOpen === id) S.laterOpen = null;

}

  const r = S.routines.get(rid); if (!r) return;

  if (S.occ.has(oid)) write('o:' + oid, () => occCol().doc(oid).delete());
